// ---------- LOP days: which dates made up an employee's loss of pay ----------
function lopDays(id, ym){
  const [y,m] = ym.split("-").map(Number), dim = new Date(y,m,0).getDate(), e = S.emps[id] || {}, L = ledger(id), out = [], pl = [], co = [];
  for(let d=1; d<=dim; d++){
    const ds = `${ym}-${pad(d)}`; if(isOff(ds) || ds > today) continue;
    if(e.joined && ds < e.joined) continue; if(e.exitDate && ds > e.exitDate) continue;
    const st = statusOn(id, ds); let amt = 0, why = "";
    if(st==="A"){ amt = 1 - (L.cover[ds]||0); why = amt < 1 ? "Absent · part covered by a comp off" : "Absent"; }
    else if(st==="HD"){ amt = .5 - (L.cover[ds]||0); why = "Half day"; }
    else if(st==="L"){ amt = L.unpaidAmt[ds]||0; why = amt < 1 ? "Leave · part covered by balance" : "Leave · no balance left"; }
    if(amt > 0) out.push({ds, amt, why});
    if(L.plDay[ds] > 0) pl.push({ds, amt:L.plDay[ds], why: st==="HD" ? "Half day" : st==="A" ? "Absent" : "Leave"});
    if(L.coDay[ds] > 0) co.push({ds, amt:L.coDay[ds], why: st==="HD" ? "Half day" : st==="A" ? "Absent" : "Leave"});
  }
  const lates = latesIn(id, ym), lateLop = lateLopDays(lates);
  return {days:out, pl, co, lates, lateLop, total:out.reduce((t,x)=>t+x.amt,0) + lateLop, plTotal:pl.reduce((t,x)=>t+x.amt,0), coTotal:co.reduce((t,x)=>t+x.amt,0)};
}
function lopModal(id, ym){
  const e = S.emps[id]; if(!e) return; const r = lopDays(id, ym);
  const fmt = n => n === .5 ? "½" : String(n).replace(/\.5$/, "½").replace(/^0½$/, "½");
  const li = (x, cls) => { const dt = parse(x.ds); return `<li class="lop-row"><span class="lop-date"><b>${dt.toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</b><small>${dt.toLocaleDateString("en-IN",{weekday:"short"})}</small></span><span class="lop-why">${x.why}</span><span class="lop-amt ${cls||""}">${fmt(x.amt)} day</span></li>`; };
  const rows = r.days.map(x => li(x)).join("");
  const L = ledger(id), sect = (h, list, tot, cls, extra) => list.length ? `<div class="lop-sect"><h4>${h}</h4><ul class="lop-list">${list.map(x => li(x, cls)).join("")}</ul><div class="lop-total"><span>Total${extra||""}</span><b>${fmt(tot)} day${tot === 1 ? "" : "s"}</b></div></div>` : "";
  const plS = sect("Paid leave used", r.pl, r.plTotal, "pl", ` · balance now ${fmt(L.balance)} day${L.balance === 1 ? "" : "s"}`), coS = sect("Comp offs used", r.co, r.coTotal, "pl");
  const late = r.lateLop ? `<li class="lop-row"><span class="lop-date"><b>${r.lates}</b><small>late</small></span><span class="lop-why">Late marks this month</span><span class="lop-amt">${fmt(r.lateLop)} day</span></li>` : "";
  $("#overlay").innerHTML = `<div class="scrim" data-act="close"></div><div class="modal sm lop-modal" role="dialog" aria-modal="true" aria-labelledby="lopT"><header><div><h3 id="lopT" style="margin:0">${esc(e.name)}</h3><small class="note">Leave and loss of pay · ${monthName(ym)}${ym === today.slice(0,7) ? " so far" : ""}</small></div><button class="btn ghost" data-act="close" aria-label="Close">✕</button></header>
    <div class="body"><div class="lop-sect"><h4>Loss of pay</h4>${rows || late ? `<ul class="lop-list">${rows}${late}</ul><div class="lop-total"><span>Total</span><b>${fmt(r.total)} day${r.total === 1 ? "" : "s"}</b></div>` : `<p class="empty">No loss of pay days in ${monthName(ym)}.</p>`}</div>${plS}${coS}${!r.pl.length ? `<p class="note lop-bal">No paid leave used in ${monthName(ym)} · ${fmt(L.balance)} day${L.balance === 1 ? "" : "s"} left</p>` : ""}</div></div>`;
}

let JSPDF = null;
async function loadJsPDF(){
  if(JSPDF) return JSPDF;
  if(!window.jspdf) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; sc.onload = res; sc.onerror = () => rej(new Error("load")); document.head.appendChild(sc); });
  JSPDF = window.jspdf.jsPDF; return JSPDF;
}
function inWords(n){
  n = Math.round(Math.abs(n||0)); if(!n) return "Zero";
  const o = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const t = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two = x => x<20 ? o[x] : t[Math.floor(x/10)] + (x%10 ? " " + o[x%10] : "");

  if(cr) parts.push(three(cr) + " Crore"); if(lk) parts.push(two(lk) + " Lakh"); if(th) parts.push(two(th) + " Thousand"); if(n) parts.push(three(n));

const roleKey = e => isTL(e) ? "Team Leaders" : isTele(e.dept) ? "Tele Calling" : isSalesR(e.dept) ? "Sales Executives" : "Others";
const DEF_SLABS = [{from:0, rate:300}, {from:40, rate:400}, {from:60, rate:500}];
function incRates(snapshot){
  const src = snapshot || S.incCfg || {};
  const slabs = (Array.isArray(src.slabs) && src.slabs.length ? src.slabs : DEF_SLABS).map(x=>({from:Math.max(0,Math.round(+x.from||0)), rate:+x.rate||0})).sort((a,b)=>a.from-b.from);
  const sqft = {}; for(const r of INC_ROLES) sqft[r] = +(src.sqft?.[r] ?? (r==="Tele Calling" ? 2 : 0)) || 0;
  const sqftEmp = {}; for(const [k,v] of Object.entries(src.sqftEmp||{})) if(v!==null && v!=="" && isFinite(+v)) sqftEmp[k] = +v;
  const sqftG1 = src.sqftG1!=null && isFinite(+src.sqftG1) ? +src.sqftG1 : (snapshot ? sqft["Tele Calling"] : 1);
  return {slabs, slabMode: src.slabMode==="tiered" ? "tiered" : "all", sqft, sqftEmp, sqftG1, tlTeamSqft:+src.tlTeamSqft||0,

}
// Site-visit amount from the slabs. "all": every visit is paid at the rate of the slab the total reaches.
// "tiered": each visit is paid at the rate of the slab it falls in.
function visitPay(visits, R0){
  const sl = R0.slabs; if(!visits || !sl.length) return {amt:0, rate:0};
  const slabOf = n => { let r = sl[0]; for(const x of sl) if(n >= x.from) r = x; return r; };
  if(R0.slabMode==="all"){ const r = slabOf(visits).rate; return {amt:visits*r, rate:r}; }
  let amt = 0; for(let i=1; i<=visits; i++) amt += slabOf(i-1).rate; return {amt, rate:slabOf(visits).rate};
}
const slabLabel = (sl, i) => sl[i+1] ? `${sl[i].from}–${sl[i+1].from-1} visits` : `${sl[i].from}+ visits`;

// Top performer of each team leader's team for the month. HR can pick someone else; otherwise the highest figure wins (ties share the bonus each).
function topPerformers(ym){
  const doc = S.inc[ym] || {}; if(doc.status==="complete" && doc.topFinal) return doc.topFinal;
  const R0 = incRates(null); const out = {}; if(!R0.topBonus) return out;
  const members = incList(ym);
  for(const tl of leaders()){
    const team = members.filter(e => e.reportsTo===tl.id); if(!team.length) continue;
    const pick = doc.top?.[tl.id];
    if(pick && pick!=="auto"){ if(team.some(e=>e.id===pick)) out[pick] = tl.id; continue; }
    const score = e => { const b = incBase(ym, e.id); return (+b.visits||0)*1e9 + (+b.sqft||0); };
    let best = 0; team.forEach(e => { best = Math.max(best, score(e)); });
    if(best > 0) team.filter(e => score(e)===best).forEach(e => out[e.id] = tl.id);
  }
  return out;
}
// Overall top tele caller across both teams. HR can pick someone; otherwise the highest figure wins (ties share).
function overallTop(ym){
  const doc = S.inc[ym] || {}; if(doc.status==="complete" && doc.overallFinal) return doc.overallFinal;
  const R0 = incRates(null); if(!R0.overallBonus) return [];
  const tcs = incList(ym).filter(e => roleKey(e)==="Tele Calling"); if(!tcs.length) return [];
  const pick = doc.top?.overall;
  if(pick && pick!=="auto") return tcs.some(e=>e.id===pick) ? [pick] : [];
  const score = e => { const b = incBase(ym, e.id); return (+b.visits||0)*1e9 + (+b.sqft||0); };
  let best = 0; tcs.forEach(e => { best = Math.max(best, score(e)); });
  return best > 0 ? tcs.filter(e => score(e)===best).map(e=>e.id) : [];
}
function incFor(ym, id){
  const doc = S.inc[ym] || {};
  if(doc.status==="complete" && doc.final?.[id]) return doc.final[id];
  const b = incBase(ym, id); const tops = topPerformers(ym); const R0 = incRates(null);
  const bonus = tops[id] ? R0.topBonus : 0;
  const overall = overallTop(ym).includes(id) ? R0.overallBonus : 0;
  return {...b, bonus, overall, topOf: tops[id] || "", total: b.total + bonus + overall};
}
function incBase(ym, id){
  const doc = S.inc[ym] || {};
  const R0 = incRates(doc.status==="complete" ? doc.ratesUsed : null);
  const a = doc.amounts?.[id] || {}; const e = S.emps[id] || {}; const role = roleKey(e);
  const tc = role==="Tele Calling";
  const visits = tc ? Math.max(0, +a.visits||0) : 0, sqft = Math.max(0, +a.sqft||0), adj = +a.adj||0;
  const vp = visitPay(visits, R0);
  const sqRate = (R0.sqftEmp && id in R0.sqftEmp) ? R0.sqftEmp[id] : (role==="Tele Calling" && e.dept===G1) ? R0.sqftG1 : R0.sqft[role];
  const vAmt = vp.amt, sAmt = sqft*sqRate;
  return {visits, visitRate:vp.rate, sqft, sqRate, vAmt:Math.round(vAmt), sAmt:Math.round(sAmt), adj, total: Math.max(0, Math.round(vAmt+sAmt+adj))};
}

  if(!delEmpArmed){ delEmpArmed=true; btn.textContent="Click again to delete for good"; btn.classList.add("danger"); setTimeout(()=>{ delEmpArmed=false; if(btn.isConnected){ btn.textContent="Delete"; btn.classList.remove("danger"); } },4000); return; }

let clearArmed = false;

    for(const [d,a] of Object.entries(S.att)){ const keys=Object.keys(a.marks||{}); const rest=keys.filter(k=>!ids.has(k)); if(rest.length===keys.length) continue; if(!rest.length) await db.collection("attendance").doc(d).delete(); else { const m={}; rest.forEach(k=>m[k]=a.marks[k]); await db.collection("attendance").doc(d).set({...a, marks:m}); } }

// ===================== glass droplets for every segmented toggle (.seg / .dots) =====================

  const root = document.documentElement; if(!root.classList.contains("lg")) return;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mem = new Map();   // remembers where each toggle's droplet was, so it still glides after the screen redraws
  const SPRING = "cubic-bezier(.3,1.22,.4,1)";

    const btns = [...seg.children].filter(b => b.tagName === "BUTTON"); if(!btns.length) return;
    const on = btns.find(b => b.getAttribute("aria-pressed") === "true" || b.getAttribute("aria-selected") === "true");
    let pill = seg.querySelector(":scope > .seg-pill");
    if(!pill){ pill = document.createElement("span"); pill.className = "seg-pill"; pill.setAttribute("aria-hidden","true"); seg.insertBefore(pill, seg.firstChild); }
    if(!on || !on.offsetWidth){ pill.classList.remove("on"); return; }

    const cur = pill.dataset.at;
    const at = `${x},${y},${w},${h},${on.dataset.v || ""}`; if(cur === at) return;
    pill.dataset.at = at; pill.dataset.v = on.dataset.v || "";
    pill.style.width = w + "px"; pill.style.height = h + "px"; pill.style.transform = `translate(${x}px,${y}px)`;
    let from = cur ? cur.split(",").map(Number) : (prev && [prev.x, prev.y, prev.w, prev.h]);
    let resume = 0;
    if(!cur && prev && prev.run && performance.now() - prev.run.t0 < 460 && prev.x === x && prev.y === y){ from = prev.run.from; resume = performance.now() - prev.run.t0; }   // redrawn mid-glide: carry on
    if(from && !reduceMotion && root.dataset.glass !== "off" && (from[0] !== x || from[1] !== y)){
      const dx = x - from[0], sx = Math.min(1.35, 1 + Math.abs(dx) / Math.max(w, 30) * .18);
      pill.animate([
        {transform:`translate(${from[0]}px,${from[1]}px)`, width:from[2] + "px", height:from[3] + "px"},
        {transform:`translate(${from[0] + dx * .5}px,${from[1] + (y - from[1]) * .5}px) scaleY(${(1 / sx).toFixed(3)})`, width:Math.round((from[2] + w) / 2 * sx) + "px", height:h + "px", offset:.35},
        {transform:`translate(${x}px,${y}px)`, width:w + "px", height:h + "px"}

    }
    mem.set(key, {x, y, w, h, run: prev && prev.run && prev.x === x && prev.y === y ? prev.run : null}); pill.classList.add("on");
  }
  let queued = false;
  function syncAll(){ queued = false; document.querySelectorAll(".seg, .dots").forEach(sync); if(mem.size > 400) mem.clear(); }
  const q = () => { if(!queued){ queued = true; requestAnimationFrame(syncAll); } };

  new MutationObserver(() => syncAll()).observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:["aria-pressed","aria-selected"]});   // runs before paint: redrawn toggles never show a frame without their droplet
  addEventListener("resize", q);
  q();
})();

// ===================== side menu: glacier-blue glass droplet that glides to the selected item =====================
(function(){
  const root = document.documentElement; if(!root.classList.contains("lg")) return;
  const nav = document.getElementById("nav"); if(!nav) return;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pill = document.createElement("span"); pill.className = "nav-pill"; pill.setAttribute("aria-hidden","true"); nav.insertBefore(pill, nav.firstChild);
  let last = null, anim = null;
  function place(animate){
    const cur = nav.querySelector('a[aria-current="page"]:not([hidden])');
    if(!cur || !cur.offsetWidth){ pill.classList.remove("on"); last = null; return; }
    const x = cur.offsetLeft, y = cur.offsetTop, w = cur.offsetWidth, h = cur.offsetHeight, at = `${x},${y},${w},${h}`;
    if(pill.dataset.at === at) return; pill.dataset.at = at;
    const from = last; last = [x, y, w, h];
    pill.style.width = w + "px"; pill.style.height = h + "px"; pill.style.transform = `translate(${x}px,${y}px)`;
    if(animate && from && !reduceMotion && root.dataset.glass !== "off" && (from[0] !== x || from[1] !== y)){
      const dx = x - from[0], dy = y - from[1], vert = Math.abs(dy) >= Math.abs(dx);
      const s = Math.min(1.5, 1 + (vert ? Math.abs(dy) / h : Math.abs(dx) / w) * .1);
      const mw = vert ? w : Math.round(w * s), mh = vert ? Math.round(h * s) : h;
      if(anim) anim.cancel();
      anim = pill.animate([
        {transform:`translate(${from[0]}px,${from[1]}px)`, width:from[2] + "px", height:from[3] + "px"},
        {transform:`translate(${from[0] + dx / 2 - (mw - w) / 2}px,${from[1] + dy / 2 - (mh - h) / 2}px)`, width:mw + "px", height:mh + "px", offset:.4},
        {transform:`translate(${x}px,${y}px)`, width:w + "px", height:h + "px"}
      ], {duration:520, easing:"cubic-bezier(.3,1.22,.4,1)"});
    }
    pill.classList.add("on");
  }
  new MutationObserver(() => requestAnimationFrame(() => place(true))).observe(nav, {subtree:true, attributes:true, attributeFilter:["aria-current","hidden"]});
  new MutationObserver(() => requestAnimationFrame(() => place(false))).observe(document.body, {attributes:true, attributeFilter:["class"]});
  addEventListener("resize", () => { last = null; pill.dataset.at = ""; place(false); });
  setTimeout(() => place(false), 300); setTimeout(() => place(false), 1500);
})();

// ===================== desktop: float the top bar over the scrolling page =====================
(function(){
  const root = document.documentElement; if(!root.classList.contains("lg")) return;
  const body = document.body, main = document.querySelector("main"); if(!main) return;
  const phone = () => matchMedia("(max-width:760px)").matches;
  let busy = false;
  function layout(){
    busy = false;
    const head = main.querySelector(":scope > .head");
    if(phone() || !head){ body.classList.remove("lg-fixhead"); return; }
    const was = body.classList.contains("lg-fixhead");
    if(!was){ body.classList.add("lg-fixhead"); }
    const cs = getComputedStyle(main), r = main.getBoundingClientRect();
    const pl = parseFloat(cs.paddingLeft) || 0, pr = parseFloat(cs.paddingRight) || 0;
    const left = Math.round(r.left + pl), width = Math.round(main.clientWidth - pl - pr);
    const top = Math.max(12, Math.round(r.top + 12));
    root.style.setProperty("--hd-l", left + "px"); root.style.setProperty("--hd-w", width + "px"); root.style.setProperty("--hd-t", top + "px");
    root.style.setProperty("--hd-h", head.offsetHeight + "px");
  }
  const q = () => { if(!busy){ busy = true; requestAnimationFrame(layout); } };
  new MutationObserver(q).observe(main, {childList:true});
  try{ new ResizeObserver(q).observe(main); }catch(_){}
  addEventListener("resize", q);
  q(); setTimeout(q, 600); setTimeout(q, 1600);
})();

// ===================== phone side menu: pull tab (drag out / drag back / tap) =====================
(function(){
  const rail = document.getElementById("rail"), tog = document.getElementById("navToggle"); if(!rail || !tog) return;
  const phone = () => matchMedia("(max-width:760px)").matches;
  const tab = document.createElement("button"); tab.type = "button"; tab.className = "navpull"; tab.setAttribute("aria-label", "Pull out the menu");
  document.body.appendChild(tab);
  const isOpen = () => document.body.classList.contains("navopen");

  const railW = () => (rail.getBoundingClientRect().width || 328) - (document.documentElement.classList.contains("lg") && matchMedia("(max-width:760px)").matches ? 10 : 0);
  const syncW = () => document.documentElement.style.setProperty("--rail-w", Math.round(railW()) + "px");

    if(!phone()) return;
    syncW(); const w = railW();
    const prev = rail.style.transform; rail.style.setProperty("transform", `translateX(${-w}px)`, "important"); const left = rail.getBoundingClientRect().left + w; rail.style.transform = prev;   // where the open menu starts

    rail.style.setProperty("transform", `translateX(${pos - drag.w}px)`, "important");
    if(pos > 0 && !drag.open) rail.style.visibility = "visible";

    const d = drag; drag = null; document.body.classList.remove("navpull-drag");

    const dt = Math.max(1, performance.now() - d.t0), v = (d.last ? d.last.x - d.x0 : 0) / dt;   // px per ms

// ===================== phone: swipe right anywhere to pull out the menu, swipe left to send it back =====================
// (starts away from the screen edge, so Android's own edge "back" gesture is left alone)
(function(){
  const rail = document.getElementById("rail"), tog = document.getElementById("navToggle"); if(!rail || !tog) return;
  const phone = () => matchMedia("(max-width:760px)").matches && document.body.classList.contains("has-tabbar");
  const isOpen = () => document.body.classList.contains("navopen");
  const EDGE = 28;   // ignore touches this close to either edge (the system back gesture lives there)
  const scrollsX = el => { for(let e = el; e && e !== document.body; e = e.parentElement){ const c = getComputedStyle(e); if(/(auto|scroll)/.test(c.overflowX) && e.scrollWidth > e.clientWidth + 2) return true; } return false; };
  let g = null;
  document.addEventListener("touchstart", e => {
    if(!phone() || e.touches.length !== 1 || document.querySelector("#overlay .scrim")) return;
    const t = e.touches[0];
    if(t.clientX < EDGE || t.clientX > innerWidth - EDGE) return;
    if(e.target.closest("input,textarea,select,.seg,.dots,.navpull,[contenteditable]") || scrollsX(e.target)) return;
    g = {x0:t.clientX, y0:t.clientY, t0:performance.now(), open:isOpen(), lock:null, w:(rail.getBoundingClientRect().width || 328) - (document.documentElement.classList.contains("lg") ? 10 : 0)};
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if(!g) return;

      g.lock = (Math.abs(dx) > Math.abs(dy) * 1.4 && (g.open ? dx < 0 : dx > 0)) ? "x" : "no";
      if(g.lock === "x"){ document.body.classList.add("navpull-drag"); if(!g.open) rail.style.visibility = "visible"; }
    }
    if(g.lock !== "x") return;
    if(e.cancelable) e.preventDefault();
    const pos = Math.max(0, Math.min(g.w, (g.open ? g.w : 0) + dx));
    rail.style.setProperty("transform", `translateX(${pos - g.w}px)`, "important"); const pt = document.querySelector('.navpull'); if(pt) pt.style.setProperty("transform", `translateX(${pos}px)`, "important");
    g.pos = pos; g.lastX = t.clientX;
  }, {passive:false});
  const end = () => {
    if(!g) return; const d = g; g = null;
    if(d.lock !== "x") return;
    document.body.classList.remove("navpull-drag"); rail.style.transform = ""; rail.style.visibility = ""; const pt = document.querySelector('.navpull'); if(pt) pt.style.transform = "";
    const v = ((d.lastX ?? d.x0) - d.x0) / Math.max(1, performance.now() - d.t0);
    const want = Math.abs(v) > .45 ? v > 0 : (d.pos || 0) > d.w * .4;
    if(want !== isOpen()) tog.click();
  };
  document.addEventListener("touchend", end, {passive:true});
  document.addEventListener("touchcancel", end, {passive:true});
})();

// Desktop: the mouse wheel scrolls the list even when the pointer is over the header, tiles or notes.
// (Lists scroll inside their own box on wide screens; without this the wheel did nothing unless the pointer was on the list.)
(() => {
  document.addEventListener("wheel", ev => {
    if(ev.ctrlKey || ev.defaultPrevented || matchMedia("(max-width:760px)").matches) return;
    const t = ev.target; if(!t || !t.closest || t.closest("#overlay,.drawer,#rail,.inst-sheet,.dp-pop,select,textarea")) return;
    const main = document.getElementById("main"); if(!main) return;
    const dy = ev.deltaMode === 1 ? ev.deltaY * 32 : ev.deltaMode === 2 ? ev.deltaY * main.clientHeight : ev.deltaY;
    if(!dy || Math.abs(ev.deltaX) > Math.abs(dy)) return;
    const can = el => { const o = getComputedStyle(el).overflowY; return (o === "auto" || o === "scroll") && el.scrollHeight > el.clientHeight + 1 && (dy > 0 ? el.scrollTop + el.clientHeight < el.scrollHeight - 1 : el.scrollTop > 0); };
    // the browser scrolls a box itself when the pointer is inside it, unless the pointer is on a pinned (fixed) bar such as the page header
    for(let e = t; e && e !== document.documentElement; e = e.parentElement){ if(can(e)) return; if(getComputedStyle(e).position === "fixed") break; }
    if(can(main)){ main.scrollTop += dy; ev.preventDefault(); return; }
    const c = [...main.querySelectorAll(".tablewrap,.scrollbox,.slide")].filter(e => e.offsetParent && can(e)).sort((a, b) => b.clientHeight * b.clientWidth - a.clientHeight * a.clientWidth)[0];
    if(c){ c.scrollTop += dy; ev.preventDefault(); }
  }, {passive:false});
})();

// Check-in selfie: tap the photo to see it full screen; tap again (or Esc) to close.
(() => {
  const close = () => { const f = document.querySelector(".selfie-full"); if(f) f.remove(); };
  document.addEventListener("click", ev => {
    const full = ev.target.closest && ev.target.closest(".selfie-full"); if(full){ close(); return; }
    const im = ev.target.closest && ev.target.closest("img.ck-selfie.big"); if(!im) return;
    const f = document.createElement("div"); f.className = "selfie-full"; f.setAttribute("role", "dialog"); f.setAttribute("aria-label", "Photo, full screen. Tap to close.");
    const i = document.createElement("img"); i.src = im.src; i.alt = im.alt; f.appendChild(i);
    const x = document.createElement("button"); x.type = "button"; x.className = "selfie-x"; x.setAttribute("aria-label", "Close"); x.textContent = "✕"; f.appendChild(x);
    document.body.appendChild(f);
  });
  document.addEventListener("keydown", ev => { if(ev.key === "Escape") close(); });
})();

// Version check: whenever the app is opened or brought back to the front, ask GitHub for the latest version number.
// If it is newer than what is running, reload (straight away if nothing is open, otherwise offer a button).
window.APP_VERSION = "20261118081746";
(function(){
  let busy = false, shown = false;
  function bar(v){ if(shown) return; shown = true; const b = document.createElement("button"); b.className = "upd-bar"; b.textContent = "New version ready — tap to update"; b.onclick = () => go(v); document.body.appendChild(b); }
  function go(v){ try{ sessionStorage.setItem("apUpd", v); }catch(_){} location.reload(); }
  async function check(){
    if(busy || !navigator.onLine) return; busy = true;
    try{
      const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) return;
      const v = (await r.json()).v; if(!v || v === window.APP_VERSION) return;
      let tried = null; try{ tried = sessionStorage.getItem("apUpd"); }catch(_){}
      if(tried === v){ bar(v); return; }          // already reloaded once for this version; don't loop
      const open = document.querySelector("#overlay .drawer, #overlay .modal") || document.querySelector("video");
      if(open) bar(v); else go(v);
    }catch(_){} finally{ busy = false; }
  }
  window.addEventListener("load", () => setTimeout(check, 1500));
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") check(); });
  setInterval(() => { if(document.visibilityState === "visible") check(); }, 10*60*1000);
})();
</script>
</body>
