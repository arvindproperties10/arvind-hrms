<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Srigandha Properties HRMS</title>
<meta name="description" content="Attendance, leave, payroll and incentives for Srigandha Properties staff.">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/sp26-icon-192.png">
<link rel="apple-touch-icon" href="icons/sp26-apple-touch-icon.png">
<style>
/* Layout: frosted sidebar + working pane on a soft grey canvas; light theme only, Apple-style system type and blue accent */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --sunk:#f2f2f5; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3e8;
  --accent:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f1fd; --sun:#0071e3; --sun-soft:#eef5ff;
  --ok:#1f8a3b; --ok-soft:#e7f6ea; --warn:#b25e00; --warn-soft:#fff4e3; --bad:#d70015; --bad-soft:#fdecee; --leave:#5e5ce6; --leave-soft:#efefff;
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em;font-weight:700}
.brand > span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a svg{width:17px;height:17px;flex:none}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav a .count{margin-left:auto;font-size:11px;background:var(--sun);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.railfoot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.railfoot .off{display:inline-flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sun);display:inline-block}
main{padding-block:26px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.head h1{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:7px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}

.banner{border:1px solid var(--line);background:var(--sun-soft);border-radius:9px;padding:11px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner.info{background:var(--sunk)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.panel .sub{color:var(--muted);font-size:12.5px;margin-top:-8px}
.empty{color:var(--muted);padding:18px 4px;text-align:left}

.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:end;height:150px;padding-top:8px;border-bottom:1px solid var(--line);position:relative}
.bars .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10px;color:var(--muted)}
.bars .gl span{position:absolute;right:0;top:-14px;font-family:var(--f-mono)}
.bar{background:var(--accent);border-radius:3px 3px 0 0;position:relative;min-height:2px;opacity:.85}
.bar.last{opacity:1;background:var(--sun)}
.bar:hover{opacity:1}
.barlabels{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;font-size:10.5px;color:var(--muted);text-align:center;font-family:var(--f-mono)}

.deptrow{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px 10px;align-items:center}
.deptrow .nm{font-weight:600;font-size:13px}
.deptrow .n{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stack{grid-column:1/-1;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--sunk)}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right}
tfoot td{font-weight:700;background:var(--sunk);border-bottom:none}
.who{display:flex;gap:10px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:11.5px;color:var(--accent);flex:none;border:1px solid var(--line)}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);font-size:12px}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.leave{background:var(--leave-soft);color:var(--leave)}
.pill.mute{background:var(--sunk);color:var(--muted)}
.pill.sample{background:var(--sun-soft);color:var(--sun)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line);min-width:40px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="HD"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="L"]{background:var(--leave);color:#fff}
.seg button:disabled{cursor:not-allowed}
.attsum{display:flex;flex-wrap:wrap;gap:8px}

.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.req:last-child{border-bottom:none}
.req .meta{color:var(--muted);font-size:12.5px}
.req .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bal div{background:var(--sunk);border-radius:8px;padding:10px 12px}
.bal b{font-family:var(--f-display);font-size:22px;display:block;font-variant-numeric:tabular-nums}
.bal span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .full{grid-column:1/-1}

.scrim{position:fixed;inset:0;background:rgba(10,18,14,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer header h3{margin:0;font-family:var(--f-display);font-size:19px}
.drawer .body{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sect{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--sun);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.slip{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slip .top{background:var(--accent);color:var(--accent-ink);padding:14px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.slip .top b{font-family:var(--f-display);font-size:17px}
.slip .rows{display:grid;grid-template-columns:1fr 1fr}
.slip .col{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.slip .col + .col{border-left:1px solid var(--line)}
.slip .ln{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.slip .ln.t{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.slip .net{background:var(--sun-soft);padding:12px 16px;display:flex;justify-content:space-between;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.slip .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.punch{gap:16px}
.punchhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.clock b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.punchstate{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.punchbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.big{justify-content:center;padding:13px 18px;font-size:15.5px;border-radius:9px}
.tools input,.tools select{width:auto}
.datebar{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.db-arrow{border:0;background:transparent;width:38px;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.db-arrow:hover:not(:disabled){background:var(--sunk)}
.db-arrow:disabled{color:var(--line);cursor:default}
.db-label{position:relative;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-left:1px solid var(--line);border-right:1px solid var(--line);font-weight:600;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
.db-label:hover{background:var(--sunk)}
.db-label svg{width:16px;height:16px;color:var(--muted);flex:none}
.db-label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.db-label:focus-within{outline:2px solid var(--sun);outline-offset:-2px}
.slidebox{gap:14px}
.slidehead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.slidetitle{text-align:center;min-width:0}
.slidetitle h2{font-size:22px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--sun);font-weight:700}
.navbtn{width:42px;height:42px;justify-content:center;font-size:22px;line-height:1;padding:0;border-radius:50%}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dots button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.dots button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slide{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (prefers-reduced-motion:no-preference){
  .slide.in-fwd{animation:slideFwd .28s cubic-bezier(.2,.7,.3,1)}
  .slide.in-back{animation:slideBack .28s cubic-bezier(.2,.7,.3,1)}
  @keyframes slideFwd{from{transform:translateX(36px);opacity:.25}}
  @keyframes slideBack{from{transform:translateX(-36px);opacity:.25}}
  .modal{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translate(-50%,-48%) scale(.97);opacity:.4}}
  .pcard.flash .pc-amt{animation:glow 1.2s ease-out}
  @keyframes glow{from{color:var(--sun)}}
}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:border-color .15s,transform .15s,box-shadow .15s}
.pcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px -10px rgba(0,0,0,.35)}
.pcard:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.pcard.top{border-color:var(--ok);background:linear-gradient(var(--ok-soft),var(--surface) 60%)}
.pc-top{display:flex;gap:10px;align-items:center}
.pc-name{min-width:0;flex:1}
.pc-name b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-name small{color:var(--muted);font-size:12px}
.pc-figs{display:flex;gap:16px}
.pc-figs div{display:flex;flex-direction:column}
.pc-figs b{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.pc-figs span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pc-amt{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:10px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;z-index:41;display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header small{color:var(--muted);font-size:12.5px}
.modal .body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal .body > *,.drawer .body > *{flex-shrink:0}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.slabtbl{display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
.slabrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 9px;border-radius:6px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.slabrow.on{background:var(--ok-soft);color:var(--ok);font-weight:700}
.plotlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.plotlist div{display:grid;grid-template-columns:auto auto 1fr;gap:12px;padding:8px 12px;align-items:baseline;font-variant-numeric:tabular-nums}
.plotlist div + div{border-top:1px solid var(--line)}
.plotlist .note{text-align:right}
.calc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.calc-ln{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;align-items:center;font-variant-numeric:tabular-nums}
.calc-ln + .calc-ln{border-top:1px solid var(--line)}
.calc-ln small{display:block;color:var(--muted);font-size:12px}
.calc-ln.good b{color:var(--ok)}
.calc-ln.bad b{color:var(--bad)}
.calc-ln.tot{background:var(--sun-soft)}
.calc-ln.tot b{font-family:var(--f-display);font-size:22px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.team{gap:10px}
.teamhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.slabs{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.note{font-size:12.5px;color:var(--muted)}

@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand > span,.railfoot{display:none}
  .brand b{font-size:15px;white-space:nowrap}
  .nav{flex-direction:row}
  .nav a{padding:7px 9px;white-space:nowrap}

/* =====================================================================================
   LIQUID GLASS (Apple-style), performance first
   Content (tiles, tables, lists) = clear surfaces with no live blur: they sit on a smooth
   background, so a blur would look the same and cost a lot. Controls that float over
   content (tab bar, sheets, drawers, toasts, top bar) = real glass: lensing at the edges
   (top tier), light blur, specular rim that follows the phone's tilt.
   Tiers on <html>: lg-full (refraction) · lg-lite (blur only) · lg-off (solid, for
   "reduce transparency" or browsers without blur).
   ===================================================================================== */
@property --lg-a{syntax:"<angle>";inherits:true;initial-value:135deg}
html.lg{--lg-a:135deg;
  --lg-ink-shadow:0 10px 30px -12px rgba(15,30,70,.35),0 2px 6px -2px rgba(15,30,70,.12);
  --lg-rim:inset 0 0 0 1px rgba(255,255,255,.55),inset 1px 1.5px 0 -.5px rgba(255,255,255,.95),inset -1px -1px 0 -.5px rgba(255,255,255,.45);
  --lg-fill:rgba(255,255,255,.30);
  --lg-blur:blur(14px) saturate(185%) brightness(1.04);
  --tile-a:rgba(255,255,255,.72);--tile-b:rgba(255,255,255,.50);--tile-line:rgba(255,255,255,.75)}
html.lg-lite{--lg-fill:rgba(255,255,255,.58);--lg-blur:blur(12px) saturate(170%)}
html.lg-full{--lg-fill:rgba(255,255,255,.22);--lg-blur:blur(3px) saturate(190%) brightness(1.05)}
html.lg body.dark{--lg-rim:inset 0 0 0 1px rgba(255,255,255,.12),inset 1px 1.5px 0 -.5px rgba(255,255,255,.28),inset -1px -1px 0 -.5px rgba(255,255,255,.08);
  --lg-fill:rgba(30,32,40,.55);--lg-ink-shadow:0 12px 32px -12px rgba(0,0,0,.7);
  --tile-a:rgba(46,50,62,.70);--tile-b:rgba(26,28,36,.58);--tile-line:rgba(255,255,255,.09)}
html.lg-lite body.dark{--lg-fill:rgba(30,32,40,.70)}
html.lg-full body.dark{--lg-fill:rgba(24,26,34,.38)}

/* 1 — no live blur anywhere by default (this alone removes ~50 stacked blur layers) */
html.lg :not(.panel .panel,.panel .panel *),html.lg :not(.panel .panel,.panel .panel *)::before,html.lg :not(.panel .panel,.panel .panel *)::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}   /* cards inside cards keep their original glass edge */

/* 2 — background: painted once on a fixed layer instead of background-attachment:fixed (which repaints on every scroll) */
@media (max-width:760px){
  html.lg:has(body.has-tabbar){background:#e9eff9!important}
  html.lg:has(body.dark.has-tabbar){background:#0e1016!important}
  html.lg body.has-tabbar,html.lg body.dark.has-tabbar{background:transparent!important;background-attachment:scroll!important}
  html.lg body.has-tabbar::before{content:""!important;display:block!important;height:auto!important;position:fixed!important;inset:-10vmax!important;z-index:-1!important;pointer-events:none;transform:translateZ(0);
    background:radial-gradient(60vmax 60vmax at 5% 5%,rgba(0,113,227,.30),transparent 60%),radial-gradient(50vmax 50vmax at 100% 25%,rgba(255,186,73,.28),transparent 62%),
      radial-gradient(55vmax 55vmax at 85% 100%,rgba(88,86,214,.22),transparent 60%),radial-gradient(45vmax 45vmax at 5% 85%,rgba(48,176,199,.20),transparent 60%)}
  html.lg body.dark.has-tabbar::before{background:radial-gradient(60vmax 60vmax at 5% 5%,rgba(10,132,255,.26),transparent 60%),radial-gradient(50vmax 50vmax at 100% 25%,rgba(255,159,10,.14),transparent 62%),
      radial-gradient(55vmax 55vmax at 85% 100%,rgba(94,92,230,.22),transparent 60%),radial-gradient(45vmax 45vmax at 5% 85%,rgba(64,200,224,.12),transparent 60%)}
}

/* 3 — content surfaces: clear glass look, zero blur cost */
html.lg body .panel:not(.panel .panel),html.lg body .sumstrip,html.lg body .kpi,html.lg body .ucard,html.lg body .mcard,html.lg body .ck-card,html.lg body .tablewrap,html.lg body .banner{
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 42%),linear-gradient(165deg,var(--tile-a),var(--tile-b))!important;
  border:1px solid var(--tile-line)!important;
  box-shadow:0 16px 36px -24px rgba(16,42,94,.45),0 2px 8px -4px rgba(16,42,94,.10),inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 .5px rgba(255,255,255,.4)!important}
html.lg body.dark .panel:not(.panel .panel),html.lg body.dark .sumstrip,html.lg body.dark .kpi,html.lg body.dark .ucard,html.lg body.dark .mcard,html.lg body.dark .ck-card,html.lg body.dark .tablewrap,html.lg body.dark .banner{
  background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 42%),linear-gradient(165deg,var(--tile-a),var(--tile-b))!important;
  box-shadow:0 16px 36px -22px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.10)!important}


/* sticky table headers: solid tint instead of blur */
html.lg body .stickyhead thead th{background:rgba(246,249,255,.97)!important}
html.lg body.dark .stickyhead thead th{background:rgba(30,33,42,.97)!important}

/* 4 — the glass material for floating controls */
html.lg body .tabbar,html.lg body .mtop,html.lg body .drawer,html.lg body .modal,html.lg body .toast,html.lg body .inst-sheet,html.lg body .upd-bar,html.lg body .rail{
  -webkit-backdrop-filter:var(--lg-blur)!important;backdrop-filter:var(--lg-blur)!important}
html.lg body .tabbar,html.lg body .mtop{background:var(--lg-fill)!important;border:0!important;box-shadow:var(--lg-ink-shadow),var(--lg-rim)!important;isolation:isolate}
html.lg body .drawer,html.lg body .modal{background:color-mix(in srgb,var(--lg-fill) 100%,transparent)!important;box-shadow:0 30px 70px -20px rgba(10,20,50,.45),var(--lg-rim)!important}
/* sheets are read, not looked through: keep text crisp with a denser fill */
html.lg-lite body .drawer,html.lg-lite body .modal{background:rgba(255,255,255,.84)!important}
html.lg-full body .drawer,html.lg-full body .modal{background:rgba(255,255,255,.72)!important}
html.lg-lite body.dark .drawer,html.lg-lite body.dark .modal{background:rgba(28,30,38,.88)!important}
html.lg-full body.dark .drawer,html.lg-full body.dark .modal{background:rgba(28,30,38,.78)!important}
html.lg body .toast{background:rgba(20,22,28,.72)!important;box-shadow:0 10px 30px -10px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12),inset 1px 1px 0 -.5px rgba(255,255,255,.3)!important}
/* scrims: dim only (blurring the whole screen is the most expensive thing a phone can do) */
html.lg body .scrim,html.lg body .navscrim,html.lg body .inst-scrim{background:rgba(10,18,40,.30)!important}
/* specular rim that follows the light (angle driven by the phone's tilt) */
html.lg body .tabbar::after,html.lg body .mtop::after{content:""!important;display:block!important;position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;padding:1.2px;
  background:linear-gradient(var(--lg-a),rgba(255,255,255,.95),rgba(255,255,255,.18) 26%,rgba(255,255,255,0) 50%,rgba(255,255,255,.18) 74%,rgba(255,255,255,.75))!important;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.9}
html.lg body.dark .tabbar::after,html.lg body.dark .mtop::after{opacity:.35}
html.lg body .mtop::before{display:none!important}
/* (top bar keeps its floating position, so content scrolls under its glass) */

/* 5 — tab bar: floating capsule with a glass "droplet" that glides to the selected tab */
@media (max-width:760px){
  html.lg body.has-tabbar .tabbar{border-radius:32px!important;padding:6px!important;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  html.lg body .tabbar a,html.lg body .tabbar button{position:relative;z-index:2;background:none!important;border-radius:26px!important;transition:color .25s,transform .45s cubic-bezier(.2,1.5,.4,1)}
  html.lg body .tabbar a svg,html.lg body .tabbar button svg{transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
  html.lg body .tabbar [aria-current="page"] svg{transform:scale(1.1)}
  html.lg body .tabbar a:active,html.lg body .tabbar button:active{transform:scale(.94)}
  html.lg body .lg-pill{position:absolute;z-index:1;top:6px;left:0;height:calc(100% - 12px);width:60px;border-radius:26px;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,rgba(210,234,255,.80),rgba(160,206,250,.52));   /* the same glass droplet, tinted glacier blue */
    box-shadow:0 4px 14px -6px rgba(0,60,160,.35),inset 0 0 0 1px rgba(255,255,255,.9),inset 0 -6px 10px -8px rgba(0,90,200,.25);
    transition:transform .55s cubic-bezier(.25,1.35,.35,1),width .55s cubic-bezier(.25,1.35,.35,1),opacity .2s;will-change:transform}
  html.lg body.dark .lg-pill{background:linear-gradient(180deg,rgba(150,205,255,.24),rgba(110,175,240,.11));box-shadow:0 4px 14px -6px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.16)}
  html.lg body .lg-pill.on{opacity:1}
  html.lg body .lg-pill.squish{transition-duration:.18s}
}

/* 6 — interactive glass: controls lift and brighten under the finger, with a spring */
html.lg body .btn,html.lg body .kpi[data-go],html.lg body .ck-go,html.lg body .mt-burger{transition:transform .4s cubic-bezier(.2,1.6,.4,1),filter .2s,box-shadow .2s}
html.lg body .btn:active,html.lg body .ck-go:active,html.lg body .mt-burger:active{transform:scale(1.04);filter:brightness(1.08)}
html.lg body .kpi[data-go]:active{transform:scale(.98)}
html.lg body .btn.primary,html.lg body .ck-go{box-shadow:0 8px 20px -10px rgba(0,113,227,.6),inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12)!important}

/* 7 — accessibility and the "off" tier: solid, calm surfaces */
html.lg-off body .tabbar,html.lg-off body .mtop{background:rgba(255,255,255,.97)!important}
html.lg-off body.dark .tabbar,html.lg-off body.dark .mtop{background:rgba(28,30,38,.98)!important}
html.lg-off body .drawer,html.lg-off body .modal{background:#fff!important}
html.lg-off body.dark .drawer,html.lg-off body.dark .modal{background:#1c1e26!important}
html.lg-off body .panel:not(.panel .panel),html.lg-off body .sumstrip,html.lg-off body .kpi,html.lg-off body .ucard,html.lg-off body .mcard,html.lg-off body .ck-card,html.lg-off body .tablewrap{background:#fff!important}
html.lg-off body.dark .panel:not(.panel .panel),html.lg-off body.dark .sumstrip,html.lg-off body.dark .kpi,html.lg-off body.dark .ucard,html.lg-off body.dark .mcard,html.lg-off body.dark .ck-card,html.lg-off body.dark .tablewrap{background:#1c1e26!important}
html.lg-off body .tabbar::after,html.lg-off body .mtop::after{display:none!important}
html.lg.lg-off body .tabbar,html.lg.lg-off body .mtop,html.lg.lg-off body .drawer,html.lg.lg-off body .modal,html.lg.lg-off body .toast,html.lg.lg-off body .inst-sheet,html.lg.lg-off body .upd-bar,html.lg.lg-off body .rail{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
@media (prefers-reduced-motion:reduce){html.lg body .lg-pill,html.lg body .tabbar a,html.lg body .btn{transition:none!important}}

/* 8 — premium motion (transform + opacity only, so it stays on the GPU) */
@keyframes lgRise{from{opacity:0;translate:0 18px;scale:.985}to{opacity:1;translate:0 0;scale:1}}
@keyframes lgSheet{0%{opacity:0;translate:0 60px;scale:.94}60%{opacity:1}100%{opacity:1;translate:0 0;scale:1}}
@keyframes lgDrawer{from{opacity:.4;translate:40px 0}to{opacity:1;translate:0 0}}
@keyframes lgFade{from{opacity:0}to{opacity:1}}
@keyframes lgToast{0%{opacity:0;translate:0 24px;scale:.9}100%{opacity:1;translate:0 0;scale:1}}
@keyframes lgGlint{from{background-position:-160% 0}to{background-position:260% 0}}
@media (prefers-reduced-motion:no-preference){

/* dark tables: the border sits inside the rounded box (no edge running past the corners) */

/* dark: table and card edges drawn on top of their rows, so the outline is unbroken at the corners */
html.lg body.dark .tablewrap,html.lg body.dark .panel:not(.panel .panel){outline:1px solid rgba(255,255,255,.16);outline-offset:-1px}

/* Date fields on Android: hide the phone's own date text and arrow so only our label shows */
.dpwrap > input{-webkit-appearance:none!important;appearance:none!important;-webkit-text-fill-color:transparent!important;color:transparent!important;text-shadow:none!important}

/* Desktop: lists never shrink to a sliver on short screens; the page scrolls instead */
@media (min-width:761px){
  #main .tablewrap.fill{min-height:min(440px,62vh)}
}

/* ---- Friendliness pass: phone ---- */
@media (max-width:760px){
  /* nothing tappable is shorter than 34px */
  body.has-tabbar #main .btn.small,body.has-tabbar #main .dr-ask,body.has-tabbar #main .seg > button,body.has-tabbar #main select{min-height:34px!important}
  .ci-cards .cicard > .cc-foot .cc-acts .btn,.att-cards .cicard > .cc-acts .btn{height:34px!important;min-height:34px!important}
  body.has-tabbar #main .datebar .db-arrow,body.has-tabbar #main .datebar .db-reset{min-width:34px;min-height:34px}
  body.has-tabbar #main .sect-link{display:inline-block;padding:8px 0 8px 14px}
  .person .ps-num{padding:3px 0}
  /* attendance: full names, taller toggle */
  .att-cards .cicard .cc-name b,.att-cards .cicard .cc-name small{white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
  html.lg body .att-cards .cicard > .cc-seg > button{padding:8px 8px!important;min-height:34px!important}
  /* payroll / incentives header: month across the top, two secondary buttons side by side, main action full width */
  body.has-tabbar main > .head .tools:has([data-act="export"]){display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
  body.has-tabbar main > .head .tools:has([data-act="export"]) > .monthbar,body.has-tabbar main > .head .tools:has([data-act="export"]) > .btn.primary{grid-column:1/-1}
  body.has-tabbar main > .head .tools:has([data-act="export"]) > .btn{width:auto!important;min-width:0}
  /* leave balances and team: full names */
  .lg-bal td:first-child b,.person .ps-meta{white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
  /* comp-off strip fills the row like the paid-leave strip */
  .sumstrip.co-strip{display:grid!important;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-columns:none!important}
  /* team cards: number and birthday on one line */
  .person .ps-num,.person .ps-bday{display:inline-block!important;margin-right:12px}
}

  table.t-emp .emp-contact .ec-bd{font-size:12px;padding:4px 0;margin:0}
}

}

#incModal footer .inc-reset{margin-right:auto;color:#d70015}

/* LOP dates pop-up */
button.lop-btn{border:0;font:inherit;cursor:pointer;min-width:34px;min-height:26px}
button.lop-btn:hover{filter:brightness(1.08);text-decoration:underline}

.lop-sect + .lop-sect{margin-top:18px}

  height:26px;min-width:34px;padding:0 10px!important;margin:0;line-height:1!important;font-size:13px!important;font-weight:600;font-variant-numeric:tabular-nums;vertical-align:middle;text-align:center;white-space:nowrap}

  html body button.lop-mini{display:flex!important;width:max-content;height:22px;font-size:11.5px!important;padding:0 8px!important;margin:4px auto 0}

/* LOP pop-up: always centred in the visible screen, list scrolls inside it */
#overlay .modal.lop-modal{position:fixed!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;margin:0!important;
  width:min(440px,calc(100vw - 32px))!important;max-height:min(640px,calc(100vh - 140px))!important;max-height:min(640px,calc(100dvh - 140px))!important;
  display:flex!important;flex-direction:column;overflow:hidden}

  border:1px solid var(--line,rgba(0,0,0,.14))!important;background:transparent;font-size:14px!important;line-height:1;white-space:nowrap;box-sizing:border-box}

/* ---- Low-end phones (lite glass tier): bars were see-through because a blanket "no blur" rule beat them.
   Bars and pop-ups get a light blur and a much denser fill, so text behind them never shows through. ---- */
html.lg.lg-lite body .tabbar,html.lg.lg-lite body .mtop,html.lg.lg-lite body .dbfloat,html.lg.lg-lite body .toast,html.lg.lg-lite body .inst-sheet,html.lg.lg-lite body .upd-bar,
html.lg.lg-lite body #overlay .drawer,html.lg.lg-lite body #overlay .modal{-webkit-backdrop-filter:blur(10px) saturate(160%)!important;backdrop-filter:blur(10px) saturate(160%)!important}

  html.lg body .tabbar,html.lg body .mtop,html.lg body .dbfloat{background:rgba(255,255,255,.97)!important}
  html.lg body.dark .tabbar,html.lg body.dark .mtop,html.lg body.dark .dbfloat{background:rgba(22,24,30,.98)!important}
}

  html.lg:not(.lg-full) body.has-tabbar main > .head .tools:has(.datebar):has([data-act="att-all"]):has([data-act="golive-open"]){flex-wrap:wrap!important}
}

<script>
(() => {
const WEEKLY_OFF = 2; // Tuesday — offices closed
const G1 = "Tele-Calling Executive Grade 1";
const TELE_ROLES = ["Tele-Calling Executive",G1,"Senior Tele-Calling Executive"];
const SALES_ROLES = ["Sales","Senior Sales Executive","Team Leader"];
const DEPTS = [...TELE_ROLES, ...SALES_ROLES, "Reception","Housekeeping","Administration","Accounts"];
const DEPT_OLD = {"Tele Calling":"Tele-Calling Executive","Tele-Calling":"Tele-Calling Executive","Sales Executives":"Sales","Receptionist":"Reception","HR":"Administration","Tele-Calling Executive Grade 2":G1};
const isTele = d => TELE_ROLES.includes(d), isSalesR = d => SALES_ROLES.includes(d);
const normDept = d => DEPT_OLD[d] || d;
const LOCS = ["Head Office","Site Office","Vruksha","Vistara"];
const PUNCH_LOCS = ["Head Office","Site Office","Site visit","Client meeting","Field work"];
const NEEDS_PLACE = new Set(["Site visit","Client meeting","Field work"]);
const LEAVE_START = "2026-11";   // 1 paid leave accrues each month from here; unused days carry forward
const TRACK_FROM = "2026-11-01"; // deadlines before this date are not flagged as overdue
const INC_ROLES = ["Tele Calling","Sales Executives","Team Leaders","Others"];
const MARKS = [["P","Present"],["HD","Half day"],["L","Leave"]];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = iso(new Date());
const HOL = {};   // company holidays by date: { "2026-11-01": {name:"Kannada Rajyotsava"} }
const isOff = s => parse(s).getDay() === WEEKLY_OFF || !!HOL[s];
const offLabel = s => HOL[s] ? `Company holiday · ${esc(HOL[s].name||"Holiday")}` : "Weekly off — office closed";
const range = (a,b) => { const out=[]; if(!a||!b||a>b) return out; for(let d=parse(a); iso(d)<=b; d.setDate(d.getDate()+1)) out.push(iso(d)); return out; };
const workDays = (a,b) => range(a,b).filter(d => !isOff(d));
const inr = n => "₹" + Math.round(n||0).toLocaleString("en-IN");
const fmtD = s => s ? parse(s).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) : "—";
const fmtDs = s => parse(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const initials = n => (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const monthName = ym => { const [y,m]=ym.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"}); };

let db = null, userCap = null, downloads = null;
let isAdmin = false, canWrite = false, connected = false, loaded = {emp:false}, myId = "";
// ---- sign-in & per-section access (Firebase logins; the server rules enforce the same limits) ----
const SECTIONS = [["dashboard","Overview"],["employees","Employees"],["attendance","Attendance"],["leave","Leave"],["payroll","Payroll"]];   // Incentives is administrator-only, so it is not offered to HR logins
const LEVELS = [["none","No access"],["view","View only"],["edit","Can edit"]];
const SELF_VIEWS = ["checkin","myatt","myleave","myslips","myinc"];
let isOwnerV = false, authReady = false, myName = "", ME = null, USERS = {};
const isStaffU = () => !!ME && ME.active!==false && (ME.role==="owner" || ME.role==="staff");
const myEmp = () => (ME && ME.active!==false && ME.empId && S.emps[ME.empId]?.status!=="Exited") ? ME.empId : "";
function perm(v){
  if(!ME || ME.active===false || ME.pending) return "none";
  if(v==="checkins") return "none";   // merged into Attendance
  if(v==="incentives") return isOwnerV ? "edit" : "none";
  if(v==="myinc") return "none";   // incentives show on the Pay screen and payslip instead
  if(SELF_VIEWS.includes(v)) return myEmp() ? "edit" : "none";
  if(v==="selftest") return "edit";
  if(v==="team"){ if(isOwnerV || (isStaffU() && (ME.perms?.employees || "none") !== "none")) return "none";   // Employees already shows phone and birthday
    return (myEmp() || isStaffU()) ? "edit" : "none"; }
  if(isOwnerV) return "edit";
  if(v==="access" || !isStaffU()) return "none";
  if(v==="checkins") return "none";   // merged into Attendance
  if(v==="attendance") return ME.perms?.attendance && ME.perms.attendance !== "none" ? ME.perms.attendance : (ME.perms?.checkins && ME.perms.checkins !== "none" ? "view" : "none");
  return ME.perms?.[v] || "none";
}
const canSee = v => perm(v)!=="none";
const canEditView = v => perm(v)==="edit";
// leave decisions are the CEO's: the owner, or any staff login marked as CEO
const canApprove = () => isOwnerV || (isStaffU() && !!ME.approveLeave);
const actorName = () => ME?.name || "Administrator";
function needLogin(){ if(!connected) return true; if(!authReady) return true; return !ME || !!ME.pending || ME.active===false || !!ME.mustChange; }
function firstAllowed(){ if(!isStaffU() && myEmp()) return "checkin"; for(const [k] of SECTIONS) if(canSee(k)) return k; if(myEmp()) return "checkin"; return isOwnerV ? "access" : ""; }
// which section a stored path belongs to, for the in-page write guard
function pathSection(path){
  if(path.startsWith("data/hr/salaries") || path.startsWith("data/hr/payruns") || path.startsWith("data/hr/config/payroll") || path.startsWith("payslips")) return "payroll";
  if(path.startsWith("employees") || path.startsWith("directory")) return "employees";
  if(path.startsWith("attendance") || path.startsWith("attfix") || path.startsWith("config/app")) return "attendance";
  if(path.startsWith("leaves") || path.startsWith("holidays") || path.startsWith("perms")) return "leave";
  if(path.startsWith("data/hr/incentives") || path.startsWith("data/hr/config/incentive") || path.startsWith("data/hr/registrations") || path.startsWith("myinc")) return "incentives";
  if(path.startsWith("checkins") || path.startsWith("selfies") || path.startsWith("meta") || (ME && path==="users/"+ME.uid)) return "self";
  if(path.startsWith("users") || path.startsWith("logins")) return "access";
  return "dashboard";
}
function deny(path){
  const sec = pathSection(path);
  if(sec==="self") return null;

// ---------- table sorting ----------
const SORT = {};
function sortVal(td){
  if(!td) return "";
  if(td.dataset.sort!=null) return td.dataset.sort;
  const t = (td.querySelector("b,.nm")?.textContent || td.textContent || "").trim();
  const n = t.replace(/[₹,\s]/g,"");
  if(/^-?\d+(\.\d+)?$/.test(n)) return +n;
  if(/^\d{1,2} [A-Za-z]{3,9} \d{4}$/.test(t)){ const d = Date.parse(t); if(!isNaN(d)) return d; }
  return t.toLowerCase();
}
function applySort(tb, col, dir){
  const rows = [...tb.rows].filter(r => r.cells.length > col && !r.querySelector("td[colspan]"));
  if(rows.length < 2) return;
  rows.sort((a,b) => { const x=sortVal(a.cells[col]), y=sortVal(b.cells[col]);
    const c = (typeof x==="number" && typeof y==="number") ? x-y : String(x).localeCompare(String(y), undefined, {numeric:true});
    return dir*c; });
  rows.forEach(r => tb.appendChild(r));
}
function enhanceSort(root){
  root.querySelectorAll("table").forEach((tbl, ti) => {
    const head = tbl.tHead?.rows[0], tb = tbl.tBodies[0]; if(!head || !tb) return;
    const key = view+":"+ti; const st = SORT[key];
    [...head.cells].forEach((th, ci) => {
      if(!th.textContent.trim() || th.classList.contains("nosort")) return;
      th.classList.add("sortable"); th.tabIndex = 0; th.setAttribute("aria-sort", st&&st.col===ci ? (st.dir>0?"ascending":"descending") : "none");
      th.insertAdjacentHTML("beforeend", `<span class="sarr${st&&st.col===ci?" on":""}" aria-hidden="true">${st&&st.col===ci ? (st.dir>0?"▲":"▼") : "▲▼"}</span>`);
      const go = () => { const cur = SORT[key]; SORT[key] = {col:ci, dir: cur&&cur.col===ci ? -cur.dir : 1}; render(); };
      th.addEventListener("click", go); th.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
    });
    if(st) applySort(tb, st.col, st.dir);
  });
}

async function importJson(file){
  const st = $("#impStatus"); const say = t => { if(st) st.textContent = t; };
  let data; try{ data = JSON.parse(await file.text()); }catch(_){ say("That file isn't valid JSON."); return; }
  if(!data || data._format!=="arvind-hrms-migration-1" || !data.collections){ say("That isn't the HRMS migration file."); return; }
  const ops = []; for(const [col, docs] of Object.entries(data.collections)) for(const [id, d] of Object.entries(docs)) ops.push({op:"set", path:`${col}/${id}`, data:d});
  for(const [date, day] of Object.entries(data.collections.attendance||{})) for(const [id, m] of Object.entries(day.marks||{})) if(m) ops.push({op:"set", path:`attfix/${date}_${id}`, data:{empId:id, date, mark:m}});
  say(`Importing ${ops.length} records…`);
  try{ await db.batch(ops); say(`Done: ${ops.length} records imported.`); toast("Old HRMS data imported"); }catch(e){ console.error(e); say("Import failed. Check that the security rules are published and try again."); }
}

// ---- backup and clearing old records (administrator) ----
const BK_COLS = ["employees","attendance","attfix","leaves","holidays","checkins","selfies","payslips","myinc","directory","data/hr/salaries","data/hr/payruns","data/hr/incentives","data/hr/registrations","data/hr/config"];
async function backupAll(){
  const out = {_format:"arvind-hrms-migration-1", exportedAt:new Date().toISOString(), collections:{}};
  for(const col of BK_COLS){ const s = await window.FB.db.collection(col).get(); out.collections[col] = {}; s.docs.forEach(d => out.collections[col][d.id] = d.data()); }
  try{ const a = await window.FB.db.doc("config/app").get(); if(a.exists) out.collections["config"] = {app:a.data()}; }catch(_){}
  await downloads.save({filename:`arvind-hrms-backup-${today}.json`, data:JSON.stringify(out)});
  return out;
}
// which records fall on or before the cut-off date
function oldRecords(all, cut){
  const ym = cut.slice(0,7), ops = [];
  const by = (col, test) => { for(const [id,d] of Object.entries(all.collections[col]||{})) if(test(id, d)) ops.push({op:"delete", path:`${col}/${id}`}); };
  by("attendance", id => id <= cut);
  by("attfix", (id,d) => (d.date||id.slice(0,10)) <= cut);
  by("checkins", (id,d) => (d.date||id.slice(0,10)) <= cut);
  by("selfies", (id,d) => (d.date||id.slice(0,10)) <= cut);
  by("leaves", (id,d) => (d.to||d.from||"9999") <= cut);
  by("payslips", (id,d) => (d.ym||id.slice(-7)) <= ym);
  by("myinc", (id,d) => (d.ym||id.slice(-7)) <= ym);
  by("data/hr/payruns", id => id <= ym);
  by("data/hr/incentives", id => id <= ym);
  by("data/hr/registrations", (id,d) => (d.date || d.month || "9999") <= (d.date ? cut : ym));
  return ops;
}
let CLR = null;
async function clearPreview(btn){
  const cut = $("#clr_cut").value; if(!cut) return toast("Choose a date.");
  btn.disabled = true; btn.textContent = "Checking…";
  try{
    const all = {collections:{}}; for(const col of BK_COLS){ const s = await window.FB.db.collection(col).get(); all.collections[col] = {}; s.docs.forEach(d => all.collections[col][d.id] = d.data()); }
    const ops = oldRecords(all, cut); CLR = {cut, ops};
    const count = {}; ops.forEach(o => { const c = o.path.split("/").slice(0,-1).join("/"); count[c] = (count[c]||0) + 1; });
    const label = {"attendance":"attendance days","attfix":"attendance marks","checkins":"check-ins","selfies":"selfies","leaves":"leave requests","payslips":"payslips","myinc":"incentive amounts","data/hr/payruns":"payroll runs","data/hr/incentives":"incentive sheets","data/hr/registrations":"registrations"};

      <div class="acts"><input id="clr_word" autocomplete="off" placeholder="CLEAR" style="max-width:140px"><button class="btn danger" data-act="clr-run">Download backup and clear</button></div>` : `<p class="note">Nothing dated on or before ${fmtD(cut)}.</p>`;
  }catch(e){ console.error(e); toast("Couldn't read the records. Try again."); }

async function clearRun(btn){
  if(!CLR || ($("#clr_word").value||"").trim().toUpperCase() !== "CLEAR") return toast("Type CLEAR to confirm.");

  }catch(e){ console.error(e); btn.disabled = false; btn.textContent = "Download backup and clear"; toast("Clearing stopped partway. Run Preview again to finish."); }
}

// ---------- permissions: late arrival, early leave, forgot check-in / check-out ----------
// Late and early permissions are capped at 2 hours (arrive by 12:00, leave from 16:00).
// Requests about a past day (forgot, backdate, late/early) can be made up to 2 days afterwards.
const PERM_TYPES = {late:"Late arrival", early:"Early leave", in:"Forgot check-in", out:"Forgot check-out", back:"Backdate check-in"};
const PERM_ORDER = {in:0, back:1, out:2, late:3, early:4, forgive:5};
const BACK_MAX = 120;   // a check-in can be moved earlier by at most 2 hours
const PERM_WIN = {
  late:  {min:"10:16", max:"12:00", label:"I'll arrive by", hint:"Up to 2 hours late — arrive by 12:00 PM at the latest."},
  early: {min:"15:30", max:"18:14", label:"I'll leave at", hint:"Up to 2 hours before your 8 hours are done — and no earlier than 3:30 PM."},
  in:    {min:"07:00", max:"20:00", label:"I actually came in at", hint:"For a day in the last 2 days when you came to work but didn't check in."},
  out:   {min:"10:00", max:"23:59", label:"I actually left at", hint:"For a day in the last 2 days when you checked in but didn't check out."},
  back:  {min:"07:00", max:"20:00", label:"I actually came in at", hint:"You were at work earlier but checked in late. Move your check-in back by up to 2 hours."}
};
const m2t = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
// the real check-in time on a day, and the earliest time it can be backdated to
function backWin(id, d){ const raw = S.ci[`${d}_${id}`]; if(!raw?.in?.t) return null; const a = istParts(raw.in.t).mins; return {actual:m2t(a), min:m2t(Math.max(hm2m("07:00"), a - BACK_MAX)), max:m2t(Math.max(hm2m("07:00"), a - 1))}; }
const PERM_BACK_DAYS = 2, PERM_AHEAD_DAYS = 30;   // a past day can be asked about for up to 2 days afterwards
const addDays = (d, n) => { const x = parse(d); x.setDate(x.getDate() + n); return iso(x); };
const istTs = (d, hm) => new Date(`${d}T${hm}:00+05:30`);
const hm12 = hm => { if(!hm) return ""; const [h, m] = hm.split(":").map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2,"0")} ${h < 12 ? "AM" : "PM"}`; };
const permList = () => Object.entries(S.perms || {}).map(([id, p]) => ({id, ...p}));
function permsOn(id, d, status = "approved"){ return permList().filter(p => p.empId===id && p.date===d && (!status || p.status===status)).sort((a,b) => PERM_ORDER[a.type]-PERM_ORDER[b.type]); }
const durTxt = m => { const h = Math.floor(m/60), mm = m%60; return h ? `${h} hr${mm ? ` ${mm} min` : ""}` : `${mm} min`; };
function permDur(p){
  if(p.type==="late") return durTxt(Math.max(0, hm2m(p.time) - hm2m(SHIFT.start))) + " late";
  if(p.type==="early"){ const raw = S.ci[`${p.date}_${p.empId}`]; const req = raw?.in?.t ? reqOutM(istParts(raw.in.t).mins) : hm2m(SHIFT.end); return durTxt(Math.max(0, req - hm2m(p.time))) + " early"; }
  return "";
}
function permWhat(p){
  return p.type==="late" ? `Arrive by ${hm12(p.time)} · ${permDur(p)}` : p.type==="early" ? `Leave at ${hm12(p.time)} · ${permDur(p)}`
    : p.type==="in" ? `Came in at ${hm12(p.time)}${p.place ? ` · ${esc(placeName(p.place))}` : ""}`
    : p.type==="back" ? `Came in at ${hm12(p.time)}${p.actual ? ` · checked in at ${hm12(p.actual)} · ${durTxt(Math.max(0, hm2m(p.actual) - hm2m(p.time)))} earlier` : ""}` : `Left at ${hm12(p.time)}`;
}
const pendingPerms = () => permList().filter(p => p.status==="pending" && p.type!=="forgive");

// ---------- administrators: forgive a late check-in ----------
// A forgiven late doesn't count toward "3 lates = half a day's pay". Stored as an approved record so it can be undone.
const canForgive = () => isOwnerV || canEditView("attendance");
const forgiveOf = (id, d) => permList().find(p => p.empId===id && p.date===d && p.type==="forgive" && p.status==="approved");
function forgiveCtl(id, d, v){
  if(!canForgive()) return "";
  const f = forgiveOf(id, d);
  if(f) return `<span class="fg-done">Late forgiven${f.decidedBy ? ` by ${esc(f.decidedBy)}` : ""}<button class="fg-undo" data-unforgive="${f.id}">Undo</button></span>`;
  if(v && v.late && !S.att[d]?.marks?.[id]) return `<button class="btn small fg-btn" data-forgive="${id}|${d}">Forgive late</button>`;
  return "";
}
async function forgiveLate(t){
  if(!canForgive()) return; const [id, d] = t.dataset.forgive.split("|"); const c = ciFor(id, d); if(!c?.in) return;
  t.disabled = true;
  try{ const ref = db.collection("perms").doc();
    await ref.set({id:ref.id, empId:id, name:S.emps[id]?.name || "", type:"forgive", date:d, time:m2t(istParts(c.in.t).mins), reason:"Late forgiven by administrator", status:"approved", at:new Date().toISOString(), appliedBy:actorName(), decidedOn:today, decidedBy:actorName()});
    toast(`Late forgiven for ${S.emps[id]?.name || "this employee"}`); }
  catch(e){ t.disabled = false; fail(e); }
}
async function unforgive(t){
  if(!canForgive()) return; t.disabled = true;
  try{ await db.collection("perms").doc(t.dataset.unforgive).delete(); toast("Late mark restored"); }catch(e){ t.disabled = false; fail(e); }
}

// ---------- employee: request form + list ----------
function permForm(){
  const t = UI.mpType || "late"; let w = PERM_WIN[t]; const forgot = t==="in" || t==="out";
  const dMin = addDays(today, -PERM_BACK_DAYS), dMax = forgot ? addDays(today, -1) : t==="back" ? today : addDays(today, PERM_AHEAD_DAYS);
  let d = UI.mpDate || (forgot ? addDays(today, -1) : today); if(d < dMin) d = dMin; if(d > dMax) d = dMax;
  const bw = t==="back" ? backWin(myEmp(), d) : null;

function camAttach(){ const v = document.getElementById("ck_video"); if(v && CK.cam && v.srcObject !== CK.cam){ v.srcObject = CK.cam; v.play().catch(()=>{}); } }
async function camOpen(){
  CK.camErr = "";
  if(!navigator.mediaDevices?.getUserMedia){ CK.camErr = "unsupported"; render(); return; }
  try{
    camStop();
    CK.cam = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:{ideal:720}, height:{ideal:720}}, audio:false});
    CK.step = "camera"; render(); setTimeout(camAttach, 30);
  }catch(e){ camStop(); CK.camErr = e && (e.name==="NotAllowedError" || e.name==="SecurityError") ? "blocked" : e && e.name==="NotFoundError" ? "nocam" : "failed"; CK.step = "selfie"; render(); }
}
function camShot(){
  const v = document.getElementById("ck_video"); if(!v || !v.videoWidth){ toast("Camera is still starting — try again in a second."); return; }
  const max = 360, s = Math.min(1, max/Math.max(v.videoWidth, v.videoHeight)); const c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth*s); c.height = Math.round(v.videoHeight*s);
  const g = c.getContext("2d"); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(v, 0, 0, c.width, c.height);   // mirror, like the preview
  let out = c.toDataURL("image/jpeg", .62); if(out.length > 120000) out = c.toDataURL("image/jpeg", .42);
  camStop(); CK.img = out; CK.step = "confirm"; render();
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="hidden" && CK.cam){ camStop(); if(CK.step==="camera"){ CK.step = "selfie"; render(); } } });

async function ckLocate(kind){
  CK.kind = kind; CK.err = ""; CK.far = null; CK.step = "locating"; render();
  try{
    const pos = await getPos(); let n = nearestPlace(pos.lat, pos.lng); CK.field = false;
    if(n.d > n.p.r && fieldOk()){ n = {p:{id:"field", name:"Field", r:0}, d:n.d}; CK.field = true; }
    if(n.d > n.p.r && !CK.field){
      CK.step = "idle"; CK.far = {lat:pos.lat, lng:pos.lng, acc:pos.acc, p:n.p, d:n.d};
      CK.err = `You're about ${n.d>=1000 ? (n.d/1000).toFixed(1)+" km" : Math.round(n.d)+" m"} from ${n.p.name}. You can check ${kind} only within ${n.p.r} m of ${n.p.name} or at another check-in place (Head Office, Site Office, Home Office, Vruksha, Vistara).` + (pos.acc > 100 ? ` Your phone's location is rough right now (±${Math.round(pos.acc)} m), so moving near a window may help.` : "");
      render(); return;
    }
    CK.pos = pos; CK.near = n; CK.step = "selfie"; render();
  }catch(e){ CK.step = "idle"; CK.err = e.msg || "Couldn't get your location."; render(); if(e.code===1) locHelp("blocked", kind); else if(e.code===2) locHelp("off", kind); }
}
// ---- location permission: explain before the phone asks, and show how to fix it when it's blocked or off ----
async function locState(){ try{ const r = await navigator.permissions?.query({name:"geolocation"}); return r ? r.state : "unknown"; }catch(_){ return "unknown"; } }
async function locStart(kind){
  const st = await locState();
  if(st==="denied"){ locHelp("blocked", kind); return; }
  if(st==="prompt"){ locHelp("ask", kind); return; }
  ckLocate(kind);
}

  const PINI = `<div class="loc-ic">${PIN}</div>`;

       <button class="btn primary ck-go" data-act="loc-go" data-kind="${kind}">Continue</button>`
    : mode==="off"
    ? `${PINI}<h3>Turn on your phone's location</h3><ol><li>Swipe down from the top of the screen.</li><li>Tap <b>Location</b> (it may be called GPS) so it turns on.</li><li>Come back here and tap <b>Try again</b>.</li></ol>
       <button class="btn primary ck-go" data-act="loc-go" data-kind="${kind}">Try again</button>`
    : `${PINI}<h3>Location is blocked</h3><p>The app needs your location to check you ${kind} at the office. Allow it once and it'll work every day.</p>
       ${app ? `<ol><li>Open <b>Chrome</b> → tap <b>⋮</b> → <b>Settings</b> → <b>Site settings</b> → <b>Location</b>.</li><li>Under <b>Blocked</b>, tap <b>arvindproperties10.github.io</b> → <b>Allow</b>.</li><li>Also check phone <b>Settings → Apps → Chrome → Permissions → Location</b> is <b>Allow only while using the app</b>.</li></ol>`
             : `<ol><li>Tap the <b>ⓘ</b> or lock icon at the left of the web address.</li><li>Tap <b>Permissions</b> (or <b>Site settings</b>) → <b>Location</b> → <b>Allow</b>.</li><li>If it's still blocked: phone <b>Settings → Apps → Chrome → Permissions → Location → Allow only while using the app</b>.</li></ol>`}
       <p class="loc-small">Also make sure the phone's <b>Location</b> is switched on (swipe down from the top).</p>
       <button class="btn primary ck-go" data-act="loc-go" data-kind="${kind}">I've allowed it — try again</button>`;
  $("#overlay").innerHTML = `<div class="scrim" data-act="close"></div><div class="modal sm loc-modal" role="dialog" aria-modal="true"><header><h3>Location</h3><button class="btn ghost" data-act="close" aria-label="Close">✕</button></header><div class="body">${body}</div></div>`;

async function ckSave(btn){
  const id = myEmp(); if(!id) return;
  if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }
  try{
    if(!CK.pos || Date.now() - CK.pos.at > 180000){ const pos = await getPos(); let n = nearestPlace(pos.lat, pos.lng); if(n.d > n.p.r && CK.field) n = {p:{id:"field", name:"Field", r:0}, d:n.d}; if(n.d > n.p.r && !CK.field){ ckReset(); CK.err = `You've moved out of range of ${n.p.name}. Go back and try again.`; render(); return; } CK.pos = pos; CK.near = n; }
    const now = istNow(); const d = now.date; const docId = `${d}_${id}`;
    const where = {t:db.SERVER_TIME, lat:+CK.pos.lat.toFixed(6), lng:+CK.pos.lng.toFixed(6), acc:Math.round(CK.pos.acc), place:CK.near.p.id, dist:Math.round(CK.near.d)};
    if(CK.near.p.id==="field"){ const note = ($("#ck_note")?.value || CK.note || "").trim().slice(0,100); if(CK.kind==="in" && !note){ if(btn){ btn.disabled = false; btn.textContent = "Confirm check-in"; } toast("Type where you are, e.g. the client or site name."); $("#ck_note")?.focus(); return; } if(note) where.note = note; }
    if(CK.kind==="in"){
      await db.batch([
        {op:"set", path:`checkins/${docId}`, data:{empId:id, date:d, by:ME.uid, in:where}},
        {op:"set", path:`selfies/${docId}_in`, data:{empId:id, date:d, kind:"in", img:CK.img, t:db.SERVER_TIME}}
      ]);
      toast(CK.near.p.id==="field" ? "Checked in from the field" : `Checked in at ${CK.near.p.name}`);
    } else {
      if(!CK.img){ if(btn){ btn.disabled = false; btn.textContent = "Confirm check-out"; } CK.step = "selfie"; render(); toast("Take a selfie to check out."); return; }
      try{ await db.batch([
        {op:"update", path:`checkins/${docId}`, data:{out:where}},
        {op:"set", path:`selfies/${docId}_out`, data:{empId:id, date:d, kind:"out", img:CK.img, t:db.SERVER_TIME}}
      ]); }
      catch(e){ if(!(e && e.fb==="permission-denied")) throw e;
        // the database rules don't accept check-out photos yet: still record the check-out so nobody is stuck
        await db.collection("checkins").doc(docId).update({out:where}); }
      toast(CK.near.p.id==="field" ? "Checked out from the field" : `Checked out at ${CK.near.p.name}`);
    }
    ckReset(); render();
  }catch(e){
    console.error(e); if(btn){ btn.disabled = false; btn.textContent = CK.kind==="in" ? "Confirm check-in" : "Confirm check-out"; }
    CK.err = e && e.fb==="permission-denied" ? "The server refused this check-in. Make sure your phone's date and time are set to automatic, you're inside an office area, and you haven't already checked " + CK.kind + " today." : "Couldn't save. Check your internet connection and try again.";
    render();
  }
}

function ciFlags(c, v, d){
  const f = [];
  if(v?.late) f.push(`<span class="pill warn">Late</span>`);
  if(v?.st==="HD") f.push(`<span class="pill warn">Half day</span>`);
  if(v?.early) f.push(`<span class="pill warn">Short hours</span>`);
  if(v?.pLate) f.push(`<span class="pill ok">Late · permitted</span>`);
  if(v?.pEarly) f.push(`<span class="pill ok">Early · permitted</span>`);
  if(v?.forgiven) f.push(`<span class="pill ok">Late forgiven</span>`);
  if(v?.backIn) f.push(`<span class="pill mute">Check-in backdated from ${tmIST(c.in.orig)}</span>`);
  if(v?.manualIn || v?.manualOut) f.push(`<span class="pill mute">${v.manualIn && v.manualOut ? "Times" : v.manualIn ? "Check-in" : "Check-out"} added by permission</span>`);
  if(v?.noOut && d < today) f.push(`<span class="pill bad">No check-out</span>`);
  if(v?.lowAcc) f.push(`<span class="pill mute" title="GPS accuracy ±${c.in.acc} m">Rough GPS</span>`);
  if(c && d) f.push(forgiveCtl(c.empId, d, v));
  return f.join(" ");
}
function monthStats(id, ym){
  const [y,m] = ym.split("-").map(Number); const dim = new Date(y,m,0).getDate(); const e = S.emps[id] || {};
  const s = {P:0, HD:0, A:0, L:0, late:0};
  for(let i=1;i<=dim;i++){ const d = `${ym}-${pad(i)}`; if(d > today || isOff(d)) continue; if(e.joined && d < e.joined) continue;
    const st = statusOn(id, d); if(st && s[st]!=null) s[st]++; }
  s.late = latesIn(id, ym); s.lateLop = lateLopDays(s.late);
  return s;
}

function dayRow(id, d){
  const c = ciFor(id, d), v = ciEval(c), off = isOff(d), st = statusOn(id, d); const dt = parse(d);
  const chip = `<div class="dr-date"><b>${dt.getDate()}</b><small>${dt.toLocaleDateString("en-IN",{weekday:"short"})}</small></div>`;
  const main = c ? `<span>${tmIST(c.in.t)}</span><span class="dr-arrow">–</span><span>${c.out ? tmIST(c.out.t) : "…"}</span>`
    : `<span class="dr-none">${off ? (HOL[d] ? esc(HOL[d].name||"Holiday") : "Weekly off") : leaveOn(id,d) ? "On leave" : S.att[d]?.marks?.[id] ? "Marked by HR" : st==="A" ? "No check-in" : d===today ? "Not checked in yet" : "No record"}</span>`;
  const sub = c ? [esc(placeLbl(c.in)), c.out && v ? m2hm(Math.max(0, v.outM - v.inM)) : ""].filter(Boolean).join(" · ") : "";
  // one label on the right: the most useful thing to know about the day
  const own = !isStaffU() && id===myEmp(), recent = d < today && d >= addDays(today, -PERM_BACK_DAYS), hr = !!S.att[d]?.marks?.[id];
  const asked = type => permList().some(p => p.empId===id && p.date===d && p.type===type && p.status!=="rejected");
  const pend = permsOn(id, d, "pending");
  const quick = !own || hr || leaveOn(id, d) ? ""
    : (recent && !c && !off && !asked("in")) ? `<button class="dr-ask" data-mpquick="in|${d}">Forgot to check in?</button>`
    : (recent && c && !c.out && !asked("out")) ? `<button class="dr-ask" data-mpquick="out|${d}">Forgot to check out?</button>`
    : (v && v.late && d >= addDays(today, -PERM_BACK_DAYS) && !asked("late") && !asked("back")) ? `<button class="dr-ask" data-mpquick="late|${d}">Ask late permission</button><button class="dr-ask" data-mpquick="back|${d}">Came in earlier?</button>` : "";
  const permNote = pend.length ? `<span class="dr-perm warn">${pend.map(p => PERM_TYPES[p.type]).join(", ")} · waiting</span>`
    : (v && (v.pLate || v.pEarly || v.manualIn || v.manualOut || v.backIn || v.forgiven)) ? `<span class="dr-perm">${[v.manualIn?"Check-in added":"", v.backIn?"Check-in backdated":"", v.forgiven?"Late forgiven":"", v.manualOut?"Check-out added":"", v.pLate?"Late permitted":"", v.pEarly?"Early leave permitted":""].filter(Boolean).join(" · ")}</span>` : "";
  const tag = off && !st ? "" : (v && v.noOut && d < today && !S.att[d]?.marks?.[id]) ? `<span class="tag bad">No check-out · half day</span>`
    : (v && v.st==="P" && v.late && !S.att[d]?.marks?.[id]) ? `<span class="tag warn">Late</span>`
    : st==="P" ? `<span class="tag ok">Present</span>` : st==="HD" ? `<span class="tag warn">Half day</span>` : st==="A" ? `<span class="tag bad">Absent</span>` : st==="L" ? `<span class="tag leave">Leave</span>` : "";
  return `<div class="dayrow${off?" off":""}">${chip}<div class="dr-mid"><div class="dr-times">${main}</div>${sub?`<div class="dr-sub">${sub}</div>`:""}${permNote||quick ? `<div class="dr-extra">${permNote}${quick}</div>` : ""}</div><div class="dr-st">${tag}</div></div>`;
}
function myRecent(id){
  const out = []; let d = today;
  for(let i=0; i<14 && out.length<7; i++){ if(!isOff(d)) out.push(d); const x = parse(d); x.setDate(x.getDate()-1); d = iso(x); }
  return out.map(d => dayRow(id, d)).join("");
}

function ensureMonth(ym){
  if(!isStaffU() || !db || !ym || CI_LOADED.has(ym) || (CI_FROM && `${ym}-31` >= CI_FROM)) return;

// ---- "too far" map: the nearest office's check-in circle and where the employee is ----
let LEAFLET = null;
function loadLeaflet(){
  if(LEAFLET) return LEAFLET;
  LEAFLET = new Promise((ok, no) => {
    const c = document.createElement("link"); c.rel = "stylesheet"; c.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(c);
    const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    sc.onload = () => ok(window.L); sc.onerror = () => { LEAFLET = null; no(); }; document.head.appendChild(sc);
  });
  return LEAFLET;
}
function drawFarMap(el){
  el.dataset.init = "1"; const f = CK.far; if(!f) return;
  loadLeaflet().then(L => {
    if(!el.isConnected) return;
    const m = L.map(el, {zoomControl:true, scrollWheelZoom:false, attributionControl:true});
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(m);
    const area = L.circle([f.p.lat, f.p.lng], {radius:f.p.r, color:"#0a84ff", weight:2, fillColor:"#0a84ff", fillOpacity:.16}).addTo(m);
    area.bindTooltip(f.p.name, {permanent:true, direction:"center", className:"ck-maptip"});
    if(f.acc && f.acc < 3000) L.circle([f.lat, f.lng], {radius:f.acc, color:"#d70015", weight:1, dashArray:"4 4", fillColor:"#d70015", fillOpacity:.06, interactive:false}).addTo(m);
    L.circleMarker([f.lat, f.lng], {radius:8, color:"#fff", weight:3, fillColor:"#d70015", fillOpacity:1}).addTo(m).bindTooltip("You", {permanent:true, direction:"top", offset:[0,-8], className:"ck-maptip"});
    m.fitBounds(L.latLng(f.p.lat, f.p.lng).toBounds(f.p.r * 2).extend([f.lat, f.lng]), {padding:[34, 34], maxZoom:17});
  }).catch(err => { console.warn("map", err); if(el.isConnected) el.outerHTML = `<p class="ck-sub">The map couldn't load. Check the internet connection.</p>`; });
}
new MutationObserver(() => { const el = document.getElementById("ck_map"); if(el && !el.dataset.init) drawFarMap(el); }).observe(document.documentElement, {childList:true, subtree:true});

    const sub = cur.people.reduce((t,e)=>t+incFor(ym,e.id).total,0);
    body = `<section class="panel slidebox fill">
      <div class="slidehead">
        <button class="navbtn glassbtn" data-incslide="${slides[(si-1+slides.length)%slides.length].key}" data-dir="back" aria-label="Previous role" ${slides.length<2?"disabled":""}><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
        <div class="slidetitle"><span class="eyebrow">${si+1} of ${slides.length}</span><h2>${esc(cur.label)}</h2><div class="sub" style="margin-top:2px">${cur.people.length} ${cur.people.length===1?"person":"people"} · ${inr(sub)} this month</div></div>
        <button class="navbtn glassbtn" data-incslide="${slides[(si+1)%slides.length].key}" data-dir="fwd" aria-label="Next role" ${slides.length<2?"disabled":""}><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></button>
      </div>

   (missing.length ? `<div class="banner"><span>No square-foot rate is set for ${missing.map(x=>x.label.toLowerCase()).join(", ")}, so their incentive is ₹0.</span><button class="btn small primary" data-act="inc-rates">Set rates</button></div>` : "") +

   body +
   `<p class="note inc-explain">HR enters each person's registered sq ft for the month by hand. Tele callers also earn the site-visit slab. The top performer of each team gets ${inr(R0.topBonus)} extra, and the best tele caller overall gets a further ${inr(R0.overallBonus)}, judged on ${METRIC_LABEL[R0.topMetric]}. Incentives are paid separately from salary.</p>`;

function parseCsv(t){
  const first = t.split("\n",1)[0]; const d = first.includes("\t") ? "\t" : ",", out=[]; let r=[], c="", q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ c+='"'; i++; } else q=false; } else c+=ch; }
    else if(ch==='"') q=true; else if(ch===d){ r.push(c); c=""; } else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&t[i+1]==="\n") i++; r.push(c); out.push(r); r=[]; c=""; } else c+=ch; }
  if(c || r.length){ r.push(c); out.push(r); }
  return out.filter(x=>x.some(v=>v.trim()));
}
function matchEmp(name, dept){
  const n = String(name||"").trim().toLowerCase(); if(!n) return "";
  const pool = realEmps().filter(e => !dept || (typeof dept==="function" ? dept(e.dept) : e.dept===dept));
  const hit = pool.find(e=>e.name.toLowerCase()===n) || pool.find(e=>e.name.toLowerCase().split(/\s+/)[0]===n.split(/\s+/)[0]);
  return hit ? hit.id : "";
}
const regKey = plot => "plot-" + String(plot).trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,"-");
let IMP = null;
function importPreview(){
  const box = $("#impPrev"); if(!box) return; const ym = UI.incMonth;
  const rows = parseCsv($("#impText").value || "");
  if(rows.length < 2){ IMP=null; box.innerHTML = `<p class="note">Paste the tracker's CSV, including its header row.</p>`; return; }
  const H = rows[0].map(h=>h.trim().toLowerCase()); const ix = keys => H.findIndex(h=>keys.some(k=>h.startsWith(k)));
  const c = {plot:ix(["plot"]), size:ix(["size"]), sq:ix(["sq ft","sqft","sq.ft","area","square"]), st:ix(["status"]), buyer:ix(["buyer","customer"]), reg:ix(["registered on","registration date","registered date","deed date","date"]), last:ix(["last update"]), tc:ix(["tele","telecaller"]), se:ix(["sales exec","executive","sales person","salesperson"])};
  if(c.plot<0){ IMP=null; box.innerHTML = `<p class="note">The header row needs a "Plot" column.</p>`; return; }
  const g = (r,k) => c[k]>=0 ? String(r[c[k]]||"").trim() : "";
  const take=[], skip={notReg:0, otherMonth:0, already:0}; let noDate=0, noSize=0;
  for(const r of rows.slice(1)){
    const plot = g(r,"plot"); if(!plot) continue;
    if(c.st>=0 && !/regist/i.test(g(r,"st"))){ skip.notReg++; continue; }
    let date = (g(r,"reg").match(/\d{4}-\d{2}-\d{2}/)||[])[0] || (g(r,"last").match(/^\s*(\d{4}-\d{2}-\d{2})/)||[])[1] || "";
    if(!date){ const m = g(r,"reg").match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m) date = `${m[3]}-${pad(m[2])}-${pad(m[1])}`; }
    if(date && date.slice(0,7)!==ym){ skip.otherMonth++; continue; }
    if(!date) noDate++;
    const key = regKey(plot); if(S.reg[key]){ skip.already++; continue; }
    let sqft = parseFloat(g(r,"sq").replace(/[^\d.]/g,"")) || 0; const size = g(r,"size");
    if(!sqft){ const m = size.match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)/i); if(m) sqft = Math.round(m[1]*m[2]); }
    if(!sqft) noSize++;
    take.push({key, plot, size, sqft:Math.round(sqft), buyer:g(r,"buyer"), date, tc:matchEmp(g(r,"tc"),isTele), se:matchEmp(g(r,"se"),isSalesR)});
  }
  IMP = take;
  const credited = take.filter(t=>t.tc||t.se).length;
  box.innerHTML = `<div class="bal"><div><span>To import</span><b>${take.length}</b></div><div><span>Sq ft</span><b>${take.reduce((t,x)=>t+x.sqft,0).toLocaleString("en-IN")}</b></div><div><span>Credited</span><b>${credited}</b></div></div>
   <p class="note" style="margin:8px 0 0">${[skip.notReg?`${skip.notReg} not registered`:"", skip.otherMonth?`${skip.otherMonth} registered in another month`:"", skip.already?`${skip.already} already imported`:""].filter(Boolean).join(" · ") || "Nothing skipped."}</p>
   ${noDate?`<p class="note" style="margin:4px 0 0">${noDate} plot${noDate>1?"s have":" has"} no registration date and will be counted in ${monthName(ym)}. Correct the date after import if needed.</p>`:""}
   ${noSize?`<p class="note" style="margin:4px 0 0">${noSize} plot${noSize>1?"s have":" has"} no size (odd-shaped plots). Enter the sq ft after import.</p>`:""}
   ${take.length && credited<take.length?`<p class="note" style="margin:4px 0 0">Pick the tele caller and sales executive for the remaining plots after import.</p>`:""}`;
  const btn = document.querySelector('[data-act="reg-save"]'); if(btn){ btn.disabled = !take.length; btn.textContent = take.length ? `Import ${take.length} plot${take.length>1?"s":""}` : "Import"; }

// ---------- payroll / incentive report as a PDF (A4 landscape table) ----------
async function tablePdf({title, sub, head, rows, total, align, widths, filename, btn}){
  if(!downloads){ toast("Downloads aren't available in this view."); return; }
  const lbl = btn ? btn.textContent : ""; if(btn){ btn.disabled = true; btn.textContent = "Preparing…"; }
  const done = () => { if(btn){ btn.disabled = false; btn.textContent = lbl; } };
  let jsPDF; try{ jsPDF = await loadJsPDF(); }catch(_){ done(); toast("Couldn't load the PDF maker. Check the connection and try again."); return; }
  const doc = new jsPDF({unit:"mm", format:"a4", orientation:"landscape"}); const W = 297, H = 210, M = 12;
  const blue = [0,113,227], ink = [29,29,31], mute = [110,110,115], line = [222,226,232], soft = [240,245,253];
  const tw = widths.reduce((a,b)=>a+b,0), k = (W - 2*M) / tw, cw = widths.map(w => w*k);
  const fit = (t, w) => { t = String(t ?? ""); if(doc.getTextWidth(t) <= w) return t; while(t.length > 1 && doc.getTextWidth(t + "…") > w) t = t.slice(0, -1); return t + "…"; };
  const logo = document.querySelector(".logo-full")?.src || document.querySelector(".logo-mark")?.src;
  let page = 0, y = 0;
  const header = () => { page++; y = M;
    let lh = 0; if(logo && logo.startsWith("data:image")){ try{ const ip = doc.getImageProperties(logo); const lw = Math.min(46, 14*ip.width/ip.height); lh = lw*ip.height/ip.width; doc.addImage(logo, "PNG", M, y, lw, lh); }catch(_){ lh = 0; } }
    if(!lh){ doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(...ink); doc.text("Srigandha Properties", M, y+7); lh = 9; }
    doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(...blue); doc.text(title, W-M, y+6, {align:"right"});
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...mute); doc.text(sub, W-M, y+11.5, {align:"right"});
    y += Math.max(lh, 13) + 5;
    doc.setFillColor(...soft); doc.rect(M, y, W-2*M, 8, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(...ink);
    let x = M; head.forEach((h, i) => { const r = align[i] === "r"; doc.text(fit(h, cw[i]-3), r ? x+cw[i]-1.5 : x+1.5, y+5.4, {align: r ? "right" : "left"}); x += cw[i]; });
    y += 8; };
  const row = (cells, bold) => { if(y > H - M - 12){ footer(); doc.addPage(); header(); }
    doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(8.5); doc.setTextColor(...ink);
    let x = M; cells.forEach((c, i) => { const r = align[i] === "r"; doc.text(fit(c, cw[i]-3), r ? x+cw[i]-1.5 : x+1.5, y+5, {align: r ? "right" : "left"}); x += cw[i]; });
    y += 7; doc.setDrawColor(...line); doc.setLineWidth(.2); doc.line(M, y, W-M, y); };
  const footer = () => { doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...mute);
    doc.text(`Srigandha Properties · Generated ${fmtD(today)}`, M, H-6); doc.text(`Page ${page}`, W-M, H-6, {align:"right"}); };
  header(); rows.forEach(r => row(r)); if(total){ if(y > H - M - 12){ footer(); doc.addPage(); header(); } doc.setFillColor(...soft); doc.rect(M, y, W-2*M, 7, "F"); row(total, true); }
  footer();
  try{ await downloads.save({filename, data:doc.output("blob")}); toast("PDF downloaded"); }catch(e){ if(e?.code!=="cancelled") toast("The file wasn't saved."); }
  done();
}
