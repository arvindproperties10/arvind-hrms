const roleKey = e => isTL(e) ? "Team Leaders" : isTele(e.dept) ? "Tele Calling" : isSalesR(e.dept) ? "Sales Executives" : "Others";
const DEF_SLABS = [{from:0, rate:300}, {from:40, rate:400}, {from:60, rate:500}];
function incRates(snapshot){
  const src = snapshot || S.incCfg || {};
  const slabs = (Array.isArray(src.slabs) && src.slabs.length ? src.slabs : DEF_SLABS).map(x=>({from:Math.max(0,Math.round(+x.from||0)), rate:+x.rate||0})).sort((a,b)=>a.from-b.from);
  const sqft = {}; for(const r of INC_ROLES) sqft[r] = +(src.sqft?.[r] ?? (r==="Tele Calling" ? 2 : 0)) || 0;
  const sqftEmp = {}; for(const [k,v] of Object.entries(src.sqftEmp||{})) if(v!==null && v!=="" && isFinite(+v)) sqftEmp[k] = +v;
  const sqftG1 = src.sqftG1!=null && isFinite(+src.sqftG1) ? +src.sqftG1 : (snapshot ? sqft["Tele Calling"] : 1);
  return {slabs, slabMode: src.slabMode==="tiered" ? "tiered" : "all", sqft, sqftEmp, sqftG1, tlTeamSqft:+src.tlTeamSqft||0,
    topBonus: src.topBonus==null ? 10000 : (+src.topBonus||0), overallBonus: src.overallBonus==null ? 5000 : (+src.overallBonus||0), topMetric: "visits"};
}
// Site-visit amount from the slabs. "all": every visit is paid at the rate of the slab the total reaches.
// "tiered": each visit is paid at the rate of the slab it falls in.
function visitPay(visits, R0){
  const sl = R0.slabs; if(!visits || !sl.length) return {amt:0, rate:0};
  const slabOf = n => { let r = sl[0]; for(const x of sl) if(n >= x.from) r = x; return r; };
  if(R0.slabMode==="all"){ const r = slabOf(visits).rate; return {amt:visits*r, rate:r}; }
  let amt = 0; for(let i=1; i<=visits; i++) amt += slabOf(i-1).rate; return {amt, rate:slabOf(visits).rate};
}
const slabLabel = (sl, i) => sl[i+1] ? `${sl[i].from}–${sl[i+1].from-1} visits` : `${sl[i].from}+ visits`;
function regFor(ym, id){ let sqft=0, n=0; for(const r of Object.values(S.reg)) if(r.month===ym && (r.tc===id || r.se===id)){ sqft += +r.sqft||0; n++; } return {sqft, n}; }
const regOfMonth = ym => Object.entries(S.reg).map(([k,r])=>({key:k,...r})).filter(r=>r.month===ym).sort((a,b)=>(a.date||"").localeCompare(b.date||"") || String(a.plot).localeCompare(String(b.plot),undefined,{numeric:true}));
function incList(ym){ return payList(ym).map(r=>r.e).filter(e=>!NO_INCENTIVE.has(e.dept) && !e.noIncentive && incEligible(e, ym)).sort((a,b)=>DEPTS.indexOf(a.dept)-DEPTS.indexOf(b.dept) || byRank(a,b)); }
const METRIC_LABEL = {visits:"site visits (a tie goes to higher sq ft)"};
// Top performer of each team leader's team for the month. HR can pick someone else; otherwise the highest figure wins (ties share the bonus each).
function topPerformers(ym){
  const doc = S.inc[ym] || {}; if(doc.status==="complete" && doc.topFinal) return doc.topFinal;
  const R0 = incRates(null); const out = {}; if(!R0.topBonus) return out;
  const members = incList(ym);
  for(const tl of leaders()){
    const team = members.filter(e => e.reportsTo===tl.id); if(!team.length) continue;
    const pick = doc.top?.[tl.id];
    if(pick && pick!=="auto"){ if(team.some(e=>e.id===pick)) out[pick] = tl.id; continue; }
    const score = e => { const b = incBase(ym, e.id); return (+b.visits||0)*1e9 + (+b.sqft||0); };
    let best = 0; team.forEach(e => { best = Math.max(best, score(e)); });
    if(best > 0) team.filter(e => score(e)===best).forEach(e => out[e.id] = tl.id);
  }
  return out;
}
// Overall top tele caller across both teams. HR can pick someone; otherwise the highest figure wins (ties share).
function overallTop(ym){
  const doc = S.inc[ym] || {}; if(doc.status==="complete" && doc.overallFinal) return doc.overallFinal;
  const R0 = incRates(null); if(!R0.overallBonus) return [];
  const tcs = incList(ym).filter(e => roleKey(e)==="Tele Calling"); if(!tcs.length) return [];
  const pick = doc.top?.overall;
  if(pick && pick!=="auto") return tcs.some(e=>e.id===pick) ? [pick] : [];
  const score = e => { const b = incBase(ym, e.id); return (+b.visits||0)*1e9 + (+b.sqft||0); };
  let best = 0; tcs.forEach(e => { best = Math.max(best, score(e)); });
  return best > 0 ? tcs.filter(e => score(e)===best).map(e=>e.id) : [];
}
function incFor(ym, id){
  const doc = S.inc[ym] || {};
  if(doc.status==="complete" && doc.final?.[id]) return doc.final[id];
  const b = incBase(ym, id); const tops = topPerformers(ym); const R0 = incRates(null);
  const bonus = tops[id] ? R0.topBonus : 0;
  const overall = overallTop(ym).includes(id) ? R0.overallBonus : 0;
  return {...b, bonus, overall, topOf: tops[id] || "", total: b.total + bonus + overall};
}
function incBase(ym, id){
  const doc = S.inc[ym] || {};
  const R0 = incRates(doc.status==="complete" ? doc.ratesUsed : null);
  const a = doc.amounts?.[id] || {}; const e = S.emps[id] || {}; const role = roleKey(e);
  const tc = role==="Tele Calling";
  const visits = tc ? Math.max(0, +a.visits||0) : 0, sqft = Math.max(0, +a.sqft||0), adj = +a.adj||0;
  const vp = visitPay(visits, R0);
  const sqRate = (R0.sqftEmp && id in R0.sqftEmp) ? R0.sqftEmp[id] : (role==="Tele Calling" && e.dept===G1) ? R0.sqftG1 : R0.sqft[role];
  const vAmt = vp.amt, sAmt = sqft*sqRate;
  return {visits, visitRate:vp.rate, sqft, sqRate, vAmt:Math.round(vAmt), sAmt:Math.round(sAmt), adj, total: Math.max(0, Math.round(vAmt+sAmt+adj))};
}
async function setIncStatus(status){
  const ym = UI.incMonth; const ref = db.collection("data/hr/incentives").doc(ym);
  try{
    if(status==="complete"){
      const final = {}; incList(ym).forEach(e => { final[e.id] = {...incFor(ym, e.id), name:e.name, code:e.code, dept:e.dept}; });
      const R0 = incRates(null); const topFinal = topPerformers(ym); const overallFinal = overallTop(ym);
      await serial("inc/"+ym, async () => { const snap = await ref.get(); const body = {status:"complete", completedAt:new Date().toISOString(), by:myId, ratesUsed:R0, final, topFinal, overallFinal}; if(snap.exists) await ref.update(body); else await ref.set({month:ym, amounts:{}, ...body}); });
      await db.batch(Object.entries(final).map(([id, f]) => ({op:"set", path:`myinc/${id}_${ym}`, data:{...f, empId:id, ym, payDate:incDue(ym)}})));
      toast(`${monthName(ym)} incentives finalized`);
    } else {
      await mergeWrite("inc/"+ym, ref, {status:"open", completedAt:""}, {month:ym, amounts:{}});
      await db.batch(Object.keys(S.inc[ym]?.final||{}).map(id => ({op:"delete", path:`myinc/${id}_${ym}`}))).catch(quiet);
      toast("Incentives reopened");
    }
  }catch(e){ fail(e); }
}
const INC_FIELDS = {incv:"visits", incs:"sqft", inca:"adj", incn:"note"};
async function saveInc(inputId, raw){
  const ym = UI.incMonth; const [k, id] = [inputId.slice(0,4), inputId.slice(5)]; const field = INC_FIELDS[k]; if(!field) return;
  let val;
  if(field==="note") val = String(raw).trim();
  else if(field==="adj") val = raw==="" ? 0 : Math.round(+raw||0);
  else val = raw==="" ? 0 : Math.max(0, field==="visits" ? Math.round(+raw||0) : Math.round((+raw||0)*100)/100);
  delete UI.incDraft[inputId];
  if((S.inc[ym]?.amounts?.[id]?.[field] ?? (field==="note"?"":0)) === val){ render(); return; }
  if(field!=="note") flash = id;
  const patch = {amounts:{[id]:{[field]:val}}, updatedAt:new Date().toISOString()};
  S.inc[ym] = deepMerge(S.inc[ym], patch); render();
  try{ await mergeWrite("inc/"+ym, db.collection("data/hr/incentives").doc(ym), patch, {month:ym, status:"open"}); }catch(e){ fail(e); }
}

async function saveRates(){
  const n = id => { const v = parseFloat(document.getElementById(id).value); return isFinite(v) && v>=0 ? v : 0; };
  const slabs = []; for(let i=0;i<5;i++){ const f=document.getElementById("sl_f"+i).value, r=document.getElementById("sl_r"+i).value; if(f!=="" && r!=="") slabs.push({from:Math.round(n("sl_f"+i)), rate:n("sl_r"+i)}); }
  if(!slabs.length || !slabs.some(x=>x.from===0)){ toast("Add a slab that starts from 0 visits."); return; }
  const sqft = {}; INC_ROLES.forEach((r,i) => sqft[r] = n("r_s"+i));
  const sqftEmp = {}; document.querySelectorAll('[id^="re_"]').forEach(el => { if(el.value!=="" && isFinite(+el.value) && +el.value>=0) sqftEmp[el.id.slice(3)] = +el.value; });
  const body = {slabs:slabs.sort((a,b)=>a.from-b.from), slabMode:document.getElementById("sl_mode").value, sqft, sqftEmp, sqftG1:n("r_g1"), tlTeamSqft:0, topBonus:n("r_top"), overallBonus:n("r_overall"), topMetric:"visits", updatedAt:new Date().toISOString(), by:myId};
  try{ await db.doc("data/hr/config/incentive").set(body); S.incCfg = body; closeDrawer(); render(); toast("Incentive rates saved"); }catch(e){ fail(e); }
}

let delEmpArmed = false;
async function delEmp(btn){
  const id = $("#empForm")?.dataset.id; if(!id || !S.emps[id]) return; const nm = S.emps[id].name;
  if(!delEmpArmed){ delEmpArmed=true; btn.textContent="Click again to delete for good"; btn.classList.add("danger"); setTimeout(()=>{ delEmpArmed=false; if(btn.isConnected){ btn.textContent="Delete"; btn.classList.remove("danger"); } },4000); return; }
  delEmpArmed=false; btn.disabled = true;
  try{
    for(const [lid,l] of Object.entries(S.leaves)) if(l.empId===id) await db.collection("leaves").doc(lid).delete();
    for(const [d,a] of Object.entries(S.att)){ if(!a.marks || !(id in a.marks)) continue; const m={...a.marks}; delete m[id]; if(!Object.keys(m).length) await db.collection("attendance").doc(d).delete(); else await db.collection("attendance").doc(d).set({...a, marks:m}); }
    for(const [oid,o] of Object.entries(S.emps)) if(oid!==id && (o.reportsTo===id || o.reportingTo===id)) await db.collection("employees").doc(oid).set({...o, reportsTo:o.reportsTo===id?"":o.reportsTo, reportingTo:o.reportingTo===id?"":(o.reportingTo||"")});
    if(isAdmin){ try{ await db.doc("data/hr/salaries/"+id).delete(); }catch(e){} }
    await db.collection("employees").doc(id).delete();
    closeDrawer(); toast(`${nm} deleted`);
  }catch(e){ btn.disabled=false; fail(e); }
}

let clearArmed = false;
async function clearSample(btn){
  if(!clearArmed){ clearArmed=true; btn.textContent="Click again to remove"; btn.classList.add("danger"); setTimeout(()=>{clearArmed=false; render();},4000); return; }
  btn.disabled = true;
  const ids = new Set(Object.entries(S.emps).filter(([,e])=>e.sample).map(([id])=>id));
  try{
    for(const [lid,l] of Object.entries(S.leaves)) if(l.sample || ids.has(l.empId)) await db.collection("leaves").doc(lid).delete();
    for(const [d,a] of Object.entries(S.att)){ const keys=Object.keys(a.marks||{}); const rest=keys.filter(k=>!ids.has(k)); if(rest.length===keys.length) continue; if(!rest.length) await db.collection("attendance").doc(d).delete(); else { const m={}; rest.forEach(k=>m[k]=a.marks[k]); await db.collection("attendance").doc(d).set({...a, marks:m}); } }
    for(const id of ids){ await db.doc("data/hr/salaries/"+id).delete(); await db.collection("employees").doc(id).delete(); }
    toast("Sample data removed");
  }catch(e){ fail(e); }
}

(function(){
  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function enhance(root){
    (root.querySelectorAll ? root : document).querySelectorAll('input[type="password"]:not([data-pw])').forEach(inp => {
      inp.dataset.pw = "1";
      const wrap = document.createElement("span"); wrap.className = "pw-wrap";
      inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
      const b = document.createElement("button"); b.type = "button"; b.className = "pw-eye"; b.setAttribute("aria-label", "Show password"); b.innerHTML = EYE;
      b.addEventListener("mousedown", e => e.preventDefault());   // keep the keyboard open
      b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); const show = inp.type === "password"; inp.type = show ? "text" : "password"; b.innerHTML = show ? EYE_OFF : EYE; b.setAttribute("aria-label", show ? "Hide password" : "Show password"); inp.focus(); });
      wrap.appendChild(b);
    });
  }
  new MutationObserver(ms => { for(const m of ms) for(const n of m.addedNodes) if(n.nodeType === 1) enhance(n); }).observe(document.documentElement, {childList:true, subtree:true});
  enhance(document);
})();

// Version check: whenever the app is opened or brought back to the front, ask GitHub for the latest version number.
// If it is newer than what is running, reload (straight away if nothing is open, otherwise offer a button).
window.APP_VERSION = "20261104113842";
(function(){
  let busy = false, shown = false;
  function bar(v){ if(shown) return; shown = true; const b = document.createElement("button"); b.className = "upd-bar"; b.textContent = "New version ready — tap to update"; b.onclick = () => go(v); document.body.appendChild(b); }
  function go(v){ try{ sessionStorage.setItem("apUpd", v); }catch(_){} location.reload(); }
  async function check(){
    if(busy || !navigator.onLine) return; busy = true;
    try{
      const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) return;
      const v = (await r.json()).v; if(!v || v === window.APP_VERSION) return;
      let tried = null; try{ tried = sessionStorage.getItem("apUpd"); }catch(_){}
      if(tried === v){ bar(v); return; }          // already reloaded once for this version; don't loop
      const open = document.querySelector("#overlay .drawer, #overlay .modal") || document.querySelector("video");
      if(open) bar(v); else go(v);
    }catch(_){} finally{ busy = false; }
  }
  window.addEventListener("load", () => setTimeout(check, 1500));
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") check(); });
  setInterval(() => { if(document.visibilityState === "visible") check(); }, 10*60*1000);
})();
